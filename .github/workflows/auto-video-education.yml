name: Auto-generate video (education channel)

# Same pipeline as auto-video.yml, but for the second "education & learning for
# school students" channel -- a separate YouTube channel under the same Gmail
# account, with its own OAuth token and its own theme queue, sharing this
# repo's codebase instead of forking it.
on:
  schedule:
    # 05:37 UTC daily -- offset from auto-video.yml's 05:07 run so the two
    # don't contend for the same GitHub-hosted runner pool at once.
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: "One-off theme to run instead of the next themes_education.yaml entry (optional)"
        required: false
        default: ""
      duration:
        description: "Target seconds for the one-off --theme run (ignored for the scheduled path)"
        required: false
        default: "60"

concurrency:
  group: auto-video-education
  cancel-in-progress: false

permissions:
  contents: write # to commit themes_education.yaml's updated done:true flags back

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: education # secrets (PEXELS_API_KEY/GROQ_API_KEY/YOUTUBE_TOKEN_JSON) live in this GitHub Environment, scoped to the education channel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Seed YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p /tmp/youtube_seed
          echo "$YOUTUBE_TOKEN_JSON" > /tmp/youtube_seed/youtube_token.json

      - name: Run pipeline
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN_SEED_FILE: /tmp/youtube_seed/youtube_token.json
          YOUTUBE_AUTO_UPLOAD: "true"
          # Microsoft's free edge-tts endpoint blocks GitHub Actions' published IP
          # ranges outright (confirmed on both ubuntu-latest and macos-latest), so
          # CI narration uses Google Cloud Text-to-Speech's officially-authenticated
          # API instead. Render/local stay on edge-tts by default (var unset there).
          TTS_ENGINE: "google"
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          # Gemini 2.5 Flash Image ("Nano Banana") -- primary AI thumbnail/hook
          # background generator (see pipeline/ai_thumbnail.py). Optional: if
          # unset, generation falls back straight to Pollinations.ai.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Separate usage-counter file from auto-video.yml's so the two
          # workflows' independent commit+push steps never conflict on the
          # same file if their runs overlap.
          GOOGLE_TTS_USAGE_FILE: google_tts_usage_education.json
          # Same reasoning, for the recent-Pexels-asset-usage record that
          # pipeline/visuals.py uses to stop successive videos from repeating
          # the same stock clips (see pipeline/config.py's VISUAL_USAGE_FILE).
          VISUAL_USAGE_FILE: visual_usage_education.json
          # Same reasoning, for the Gemini daily image-generation cap tracker.
          GEMINI_IMAGE_USAGE_FILE: gemini_image_usage_education.json
        run: |
          if [ -n "${{ github.event.inputs.theme }}" ]; then
            python3 run.py --theme "${{ github.event.inputs.theme }}" --duration "${{ github.event.inputs.duration || '60' }}" --shorts
          else
            python3 run.py --themes-file themes_education.yaml
          fi

      - name: Persist updated themes_education.yaml and usage counters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add themes_education.yaml google_tts_usage_education.json visual_usage_education.json gemini_image_usage_education.json
          git diff --cached --quiet && exit 0
          git commit -m "Mark generated theme as done (education) [skip ci]"
          # The pipeline run above can take close to an hour, so origin/main may
          # have moved (e.g. a manual push, or the sibling auto-video.yml run)
          # since this job's checkout -- rebase onto the latest before pushing
          # instead of failing outright on a non-fast-forward rejection.
          # google_tts_usage_education.json is a single incrementing number --
          # a plain text merge can't combine two independent increments of the
          # same line, so register a merge driver that sums the deltas instead
          # of conflicting (see .gitattributes).
          git config merge.usage-counter.driver "python3 scripts/merge_usage_counter.py %O %A %B"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
