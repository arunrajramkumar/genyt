name: Auto-generate video

# Runs the fully-automated theme -> script -> video -> YouTube-upload pipeline
# (run.py) on a schedule, instead of requiring someone to open the web UI or
# Telegram bot. GitHub's hosted runners (7GB RAM / 2 vCPU / 14GB disk) have far
# more headroom than the 512MB free-tier host this app also deploys to, and
# since this is a "run once, then exit" batch job rather than an always-on
# server, there's no sleep/cold-start tradeoff to manage.
on:
  schedule:
    # 05:00 UTC daily. Cron minute is offset off :00 on purpose — GitHub warns
    # that jobs scheduled exactly on the hour pile up and can be delayed.
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: "One-off theme to run instead of the next themes.yaml entry (optional)"
        required: false
        default: ""

concurrency:
  group: auto-video
  cancel-in-progress: false

permissions:
  contents: write # to commit themes.yaml's updated done:true flags back

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: common # secrets (PEXELS_API_KEY/GROQ_API_KEY/TAVILY_API_KEY/YOUTUBE_TOKEN_JSON) live in this GitHub Environment, not repo-level secrets
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Seed YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p /tmp/youtube_seed
          echo "$YOUTUBE_TOKEN_JSON" > /tmp/youtube_seed/youtube_token.json

      - name: Run pipeline
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_TOKEN_SEED_FILE: /tmp/youtube_seed/youtube_token.json
          YOUTUBE_AUTO_UPLOAD: "true"
          # The finance channel's real @handle -- burns a small corner watermark
          # into every upload (see pipeline/assemble.py/_overlay_watermark).
          CHANNEL_WATERMARK_TEXT: "@FinancialWealth-R"
          # Microsoft's free edge-tts endpoint blocks GitHub Actions' published IP
          # ranges outright (confirmed on both ubuntu-latest and macos-latest), so
          # CI narration uses Google Cloud Text-to-Speech's officially-authenticated
          # API instead. Render/local stay on edge-tts by default (var unset there).
          TTS_ENGINE: "google"
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.theme }}" ]; then
            python3 run.py --theme "${{ github.event.inputs.theme }}" --shorts
          else
            python3 run.py --trending
          fi

      - name: Persist updated themes.yaml and usage counters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add themes.yaml tavily_usage.json google_tts_usage.json
          git diff --cached --quiet && exit 0
          git commit -m "Mark generated theme as done [skip ci]"
          # The pipeline run above can take close to an hour, so origin/main may
          # have moved (e.g. a manual push, or the sibling auto-video-education.yml
          # run) since this job's checkout -- rebase onto the latest before pushing
          # instead of failing outright on a non-fast-forward rejection.
          # Usage-counter files (tavily_usage.json/google_tts_usage.json) are a
          # single incrementing number -- a plain text merge can't combine two
          # independent increments of the same line, so register a merge driver
          # that sums the deltas instead of conflicting (see .gitattributes).
          git config merge.usage-counter.driver "python3 scripts/merge_usage_counter.py %O %A %B"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
