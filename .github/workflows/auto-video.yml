name: Auto-generate video

# Runs the fully-automated theme -> script -> video -> YouTube-upload pipeline
# (run.py) on a schedule, instead of requiring someone to open the web UI or
# Telegram bot. GitHub's hosted runners (7GB RAM / 2 vCPU / 14GB disk) have far
# more headroom than the 512MB free-tier host this app also deploys to, and
# since this is a "run once, then exit" batch job rather than an always-on
# server, there's no sleep/cold-start tradeoff to manage.
on:
  schedule:
    # 05:00 UTC daily. Cron minute is offset off :00 on purpose — GitHub warns
    # that jobs scheduled exactly on the hour pile up and can be delayed.
    - cron: "7 5 * * *"
  # A new issue labelled "video-prompt" (the "Video prompt" issue template) runs
  # its body as the full multi-line scene-by-scene prompt -- GitHub's manual-run
  # form only has single-line inputs, an issue body is a real text area.
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      theme:
        description: "One-off theme to run instead of the next themes.yaml entry (optional)"
        required: false
        default: ""
      prompt_file:
        description: "Repo-relative path to a committed multi-line scene-by-scene prompt (e.g. prompts/adhoc.txt); takes priority over theme"
        required: false
        default: ""
      duration:
        description: "Target seconds for the one-off --theme run (ignored for the scheduled/--trending path)"
        required: false
        default: "45"

concurrency:
  group: auto-video
  cancel-in-progress: false

permissions:
  contents: write # to commit themes.yaml's updated done:true flags back
  issues: write # to comment on and close a video-prompt issue once its run finishes

jobs:
  generate:
    # Issues are public: only the repo owner's issues may spend the API quotas
    # and publish to the channel. An issue counts as a video prompt if it has
    # the "video-prompt" label OR its body has timed scene headers (the label
    # is only applied by the template if it already exists in the repo).
    if: >-
      github.event_name != 'issues' ||
      (github.actor == github.repository_owner &&
       (contains(github.event.issue.labels.*.name, 'video-prompt') ||
        contains(github.event.issue.body, ' seconds')))
    runs-on: ubuntu-latest
    environment: common # secrets (PEXELS_API_KEY/GROQ_API_KEY/TAVILY_API_KEY/YOUTUBE_TOKEN_JSON) live in this GitHub Environment, not repo-level secrets
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Seed YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p /tmp/youtube_seed
          echo "$YOUTUBE_TOKEN_JSON" > /tmp/youtube_seed/youtube_token.json

      # Uploads start private and YouTube refuses comments on private videos,
      # so each run first comments on any recent upload the owner has since
      # made public (scripts/post_engagement_comments.py). Never blocks the run.
      - name: Post engagement comments on newly public videos
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_SEED_FILE: /tmp/youtube_seed/youtube_token.json
        run: python3 scripts/post_engagement_comments.py

      - name: Run pipeline
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_TOKEN_SEED_FILE: /tmp/youtube_seed/youtube_token.json
          YOUTUBE_AUTO_UPLOAD: "true"
          # The finance channel's real @handle -- burns a small corner watermark
          # into every upload (see pipeline/assemble.py/_overlay_watermark).
          CHANNEL_WATERMARK_TEXT: "@FinancialWealth-R"
          # Microsoft's free edge-tts endpoint blocks GitHub Actions' published IP
          # ranges outright (confirmed on both ubuntu-latest and macos-latest), so
          # CI narration uses Google Cloud Text-to-Speech's officially-authenticated
          # API instead. Render/local stay on edge-tts by default (var unset there).
          TTS_ENGINE: "google"
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          # More natural Chirp 3 HD voice first; automatically back to the
          # Neural2 voice once its own 400k-characters/month counter
          # (google_tts_chirp_usage.json) is used up -- see pipeline/tts.py.
          GOOGLE_TTS_PREMIUM_VOICE: "en-IN-Chirp3-HD-Charon"
          # Gemini 2.5 Flash Image ("Nano Banana") -- primary AI thumbnail/hook
          # background generator (see pipeline/ai_thumbnail.py). Optional: if
          # unset, generation falls back straight to Pollinations.ai.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Cloudflare Workers AI -- second-tier AI thumbnail background
          # generator, tried when Gemini is unconfigured/over-cap/fails
          # (see pipeline/ai_thumbnail.py). Optional: if either is unset,
          # generation falls back straight from Gemini to Pollinations.ai.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Passed via env (not interpolated into the script) so quotes, $ or
          # backticks in a pasted theme can't break or inject into the shell.
          INPUT_THEME: ${{ github.event.inputs.theme }}
          INPUT_PROMPT_FILE: ${{ github.event.inputs.prompt_file }}
          INPUT_DURATION: ${{ github.event.inputs.duration }}
          INPUT_ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          DURATION="${INPUT_DURATION:-45}"
          if [ -n "$INPUT_ISSUE_BODY" ]; then
            python3 run.py --theme "$(printf '%s' "$INPUT_ISSUE_BODY" | tr -d '\r')" --duration "$DURATION" --shorts
          elif [ -n "$INPUT_PROMPT_FILE" ]; then
            case "$INPUT_PROMPT_FILE" in
              /*|*..*) echo "prompt_file must be a relative path inside the repo"; exit 1 ;;
            esac
            [ -f "$INPUT_PROMPT_FILE" ] || { echo "prompt_file not found: $INPUT_PROMPT_FILE (commit and push it first)"; exit 1; }
            python3 run.py --theme "$(cat "$INPUT_PROMPT_FILE")" --duration "$DURATION" --shorts
          elif [ -n "$INPUT_THEME" ]; then
            python3 run.py --theme "$INPUT_THEME" --duration "$DURATION" --shorts
          else
            python3 run.py --trending
          fi

      - name: Persist updated themes.yaml and usage counters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add themes.yaml tavily_usage.json google_tts_usage.json google_tts_chirp_usage.json visual_usage.json gemini_image_usage.json cloudflare_image_usage.json
          git diff --cached --quiet && exit 0
          git commit -m "Mark generated theme as done [skip ci]"
          # The pipeline run above can take close to an hour, so origin/main may
          # have moved (e.g. a manual push, or the sibling auto-video-education.yml
          # run) since this job's checkout -- rebase onto the latest before pushing
          # instead of failing outright on a non-fast-forward rejection.
          # Usage-counter files (tavily_usage.json/google_tts_usage.json) are a
          # single incrementing number -- a plain text merge can't combine two
          # independent increments of the same line, so register a merge driver
          # that sums the deltas instead of conflicting (see .gitattributes).
          git config merge.usage-counter.driver "python3 scripts/merge_usage_counter.py %O %A %B"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Report back on the video-prompt issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Run finished with status: $JOB_STATUS. Logs: $RUN_URL"
          gh issue close "$ISSUE_NUMBER"
