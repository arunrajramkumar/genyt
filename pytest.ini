[pytest]
testpaths = tests
addopts = -ra -q -m "not integration and not live_network" -n auto
markers =
    integration: slow end-to-end tests that shell out to real ffmpeg (no network calls) — excluded by default for speed, run explicitly with `-m integration`.
    live_network: hits real external services (Screener.in, Tavily) with no mocking — excluded by default since it's slow, rate-limit-sensitive, and non-deterministic; run explicitly with `-m live_network` to catch real-world data-shape bugs no mock can reproduce.
