    \ of the below scenarios whenever \npossible.\n5-digit + \n5-digit to \ngive a\
    \ 5-digit \nsum more \nthan 90,250\n5-digit – \n5-digit to give \na difference\
    \ \nless than \n56,503\n4-digit \n+ 4-digit \nto give a \n6-digit sum\n5-digit\
    \ \n− 4-digit \nto give \na 4-digit \ndifference\n5-digit \n+ 3-digit \nto give\
    \ a \n6-digit sum\n5-digit \n– 3-digit \nto give \na 4-digit \ndifference\n5-digit\
    \ \n+ 5-digit \nto give a \n6-digit sum\n5-digit \n− 5-digit \nto give \na 3-digit\
    \ \ndifference\n5-digit + \n5-digit to \ngive 18,500\n5-digit − \n5-digit to \n\
    give 91,500\nMath \nTalk\n40,000\n7,000\n\n1,500\n12,000\n\nNumber Play\n\nCould\
    \ you find examples for all the cases? If not, think and \ndiscuss what could\
    \ be the reason. Make other such questions \nand challenge your classmates.\n\
    2.\t Always, Sometimes, Never?\nBelow are some statements. Think, explore and\
    \ find out if \neach of the statement is ‘Always true’, ‘Only sometimes true’\
    \ \nor ‘Never true’. Why do you think so? Write your reasoning \nand discuss this\
