    \  21\n19  \t d.  47\n\ne.  12\n\nf.  19\n\nMath \nTalk\nThis number is thus also\
    \ called ‘two and \ntwo thirds’. We also write it as 2 2\n3 .\n\nFractions\n\n\
    Can we write a mixed \nnumber (mixed fraction) \nas a regular fraction?\nYes!\
