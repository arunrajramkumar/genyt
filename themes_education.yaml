    \ example a school student would relate to.\n\nTextbook excerpt:\n\"\"\"\n3.5\
    \ Pretty Palindromic Patterns\nWhat pattern do you see in these numbers: 66, 848,\
    \ 575, 797, 1111? \nThese numbers read the same from left to right and from right\
    \ to left. \nTry and see. Such numbers are called palindromes or palindromic \n\
    numbers. \n\t\nAll palindromes using 1, 2, 3\n\t\nThe numbers 121, 313, 222 are\
    \ some examples of palindromes \nusing the digits ‘1’, ‘2’, 3’. \n  Write all\
    \ possible 3-digit palindromes using these digits. \nReverse-and-add palindromes\n\
    Now, look at these additions. Try to figure out what is happening.\nSteps to follow:\
    \ Start with a \n2-digit number. Add this number \nto its reverse. Stop if you\
    \ get a \npalindrome or else repeat the \nsteps of reversing the digits and \n\
    adding. \nTry \nthe \nsame \nprocedure \nfor some other numbers, and \nperform\
    \ the same steps. Stop if \n\nyou get a palindrome. There are numbers for which\
    \ you have to \nrepeat this a large number of times. \nAre there numbers for which\
    \ you do not reach a palindrome \nat all?\n Explore\nWill reversing and adding\
    \ numbers repeatedly, starting with \na 2-digit number, always give a palindrome?\
    \ Explore and find \nout.*\n Puzzle time\ntth\nWrite the number in words:\nh\n\
    th\nu\nt\n\t\nI am a 5-digit palindrome.\n\t\nI am an odd number.\n\t\nMy ‘t’\
    \ digit is double of my ‘u’ digit. \n\t\nMy ‘h’ digit is double of my ‘t’ digit.\
    \ \n\t\nWho am I? _________________\n\n3.6 The Magic Number of Kaprekar\nD.R.\
    \ Kaprekar was a mathematics teacher in a \ngovernment school in Devlali, Maharashtra.\
    \ He liked \nplaying with numbers very much and found many \nbeautiful patterns\
    \ in numbers that were previously \nunknown.\nIn 1949, he discovered a fascinating\
    \ and magical \nphenomenon when playing with 4-digit numbers. \nMath \nTalk\n\
    *The answer is yes! For 3-digit numbers the answer is unknown.  It is suspected\
    \ that \nstarting with 196 never yields a palindrome!\n\nNumber Play\n\nFollow\
    \ these steps and experience the magic for yourselves! Pick \nany 4-digit number\
    \ having at least two different digits, say 6382.\nMake the largest number from\
    \ these \ndigits. Call it A. \nMake the smallest number from these \ndigits. Call\
    \ it B. \nSubtract B from A. Call it C.\nC = A – B\nTake a 4-digit number.\nUse\
    \ digits \nof C\nWhat happens if we continue \ndoing this?\nA = 8632\t\n\t\n\t\
    \nA = 6642\t\n\t\n\t\nA = 7641\t\n\t\n\t\nA =\t\nB = 2368\t\n\t\n\t\nB = 2466\t\
    \n\t\n\t\nB = 1467\t\n\t\n\t\nB =\nC = 8632–2368\t \t\nC = 6642–2466\t \t\nC =\
    \ 7641–1467\t \t\nC = \n   = 6264\t\n\t\n\t\n   = 4176\t\n\t\n\t\n   = 6174\n\
     Explore\nTake different 4-digit numbers and try carrying out these steps. Find\
    \ \nout what happens. Check with your friends what they got. \nYou will always\
    \ reach the magic number ‘6174’! The number \n‘6174’ is now called the ‘Kaprekar\
    \ constant’.\nCarry out these same steps with a few 3-digit numbers. What \nnumber\
    \ will start repeating?\n\"\"\""
