    3000 ÷ 200\n3400 ÷ 200\n 800 ÷ 200\n 400 ÷ 200\n 600 ÷ 200\n 1200 ÷ 200\n15 units\n\
    17 units\n4 units\n2 units\n3 units\n6 units\n\t\nHere is the bar graph that we\
    \ obtain based on the above steps:\nExpenditure ( in `)\nHouse rent\nEducation\n\
    Electricity\nTransport\nMiscellaneous\nFood\n3600\n3400\n3200\n3000\n2800\n2600\n\
    2400\n2200\n2000\n1800\n1600\n1400\n1200\n1000\n\nItem\n\nData Handling and Presentation\n\
    \n Use the bar graph to answer the following questions:\n1.\t\n\aOn which item\
