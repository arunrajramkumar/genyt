    \ is \ndivided equally among 2. The children of the second \ngroup will get more\
    \ chikki each.\n What about the following groups? In which group will each child\
    \ \nget more?\n1 chikki divided between 2 children or 4 chikkis divided among\
    \ \n7 children.\nShabnam: The children of which group will get more chikki this\
    \ \ntime? \nMukta: We must compare 1\n7  and 4\n7 . \nNow\n1 × 4\n2 × 4  = 4\n\
    8  so, 1\n2  = 4\n8 .\nShabnam: \aBut why did you multiply the numerator and denominator\
    \ \nby 4 again?\nMukta: You will see!\nWhen 4 chikkis are divided equally among\
    \ 7 children, each \none will get 4\n7  chikki. When 4 chikkis are divided equally\
    \ \namong 8 children, each one will get 4\n8 chikki. So 4\n7 > 4\n8.\n\n Suppose\
    \ the number of children is kept the same, but the number \nof units that are\
    \ being shared is increased? What can you say about \neach child’s share now?\
    \ Why? Discuss how your reasoning explains \n\n5  < 2\n5 , 3\n7  < 4\n7 , and\
    \ 1\n2  < 5\n8 .\n Now, decide in which of the two groups will each child get\
    \ a \nlarger share: \n1.  \aGroup 1 : \a3 glasses of sugarcane juice divided equally\
