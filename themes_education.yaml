    \ numbers greater than 9779.\nd.\t the sum of the largest and smallest numbers\
    \ less than 9779.\n2.\t What is the sum of the smallest and largest 5-digit palindrome?\
    \ \nWhat is their difference?\n3.\t The time now is 10:01. How many minutes until\
    \ the clock shows \nthe next palindromic time? What about the one after that?\n\
    4.\t How many rounds does the number 5683 take to reach the Kaprekar \nconstant?\n\
    \n3.8 Mental Math\nObserve the figure below. What can you say about the numbers\
    \ and \nthe lines drawn? \n38,800\n3,400\n28,000\n63,000\n61,600\n19,500\n31,000\n\
