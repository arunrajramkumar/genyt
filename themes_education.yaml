- theme: "Explain these Grade 6 CBSE Maths (NCERT Ganita Prakash) concepts from Chapter\
    \ 2 \"Lines and Angles\": Measuring Angles & Drawing Angles.\n\nUse ONLY the mathematical\
    \ facts, definitions, and rules described in the textbook excerpt below -- do\
    \ not introduce incorrect or additional mathematical claims. Make it very easy\
    \ to understand for an 11-12 year old: explain each idea simply, step by step,\
    \ and illustrate every concept with your own original real-life example a school\
    \ student would relate to.\n\nTextbook excerpt:\n\"\"\"\n2.9 Measuring Angles\n\
    We have seen how to compare two angles. But can we actually \nquantify how big\
    \ an angle is using a number without having to \ncompare it to another angle?\n\
    We saw how various angles can be compared using a circle. \nPerhaps a circle could\
    \ be used to assign measures for angles?\nFig. 2.12\nTo assign precise measures\
    \ to angles, mathematicians came up \nwith an idea. They divided the angle in\
    \ the centre of the circle into \n\nLines and Angles\n\n360 equal angles or parts.\
    \ The angle measure of each of these unit \nparts is 1 degree, which is written\
    \ as 1°.\nThis unit part is used to assign measure to any angle: the measure \n\
    of an angle is the number of 1° unit parts it contains inside it. \nFor example,\
    \ see this figure:\n30 units\nIt contains 30 units of 1° angle and so we say that\
    \ its angle measure is 30°.\nMeasures of different angles: What is the measure\
    \ of a full turn in \ndegrees? As we have taken it to contain 360 degrees, its\
    \ measure is 360°.\n  What is the measure of a straight angle in degrees? A straight\
    \ \nangle is half of a full turn. As a full-turn is 360°, a half turn is 180°.\n\
    What is the measure of a right angle in degrees? Two right angles \ntogether form\
    \ a straight angle. As a straight angle measures 180°, a \nright angle measures\
    \ 90°.\nA\nO\n180 units\n90 units\nB\nA\nO\nB\nA\nO\nB\nA\nO\nB\nA pinch of history\n\
    A full turn has been divided into 360°. Why 360? The reason why \nwe use 360°\
    \ today is not fully known. The division of a circle into \n\n360 parts goes back\
    \ to ancient times. The Rigveda, one of the very \noldest texts of humanity going\
    \ back thousands of years, speaks of \na wheel with 360 spokes (Verse 1.164.48).\
    \ Many ancient calendars, \nalso going back over 3000 years—such as calendars\
    \ of India, Persia, \nBabylonia and Egypt—were based on having 360 days in a year.\
    \ In \naddition, Babylonian mathematicians frequently used divisions of 60 \n\
    and 360 due to their use of sexagesimal numbers and counting by 60s. \nPerhaps\
    \ the most important and practical answer for why \nmathematicians over the years\
    \ have liked and continued to use 360 \ndegrees is that 360 is the smallest number\
    \ that can be evenly divided \nby all numbers up to 10, aside from 7. Thus, one\
    \ can break up the \ncircle into 1, 2, 3, 4, 5, 6, 8, 9 or 10 equal parts, and\
    \ still have a whole \nnumber of degrees in each part! Note that 360 is also evenly\
    \ divisible \nby 12, the number of months in a year, and by 24, the number of\
    \ \nhours in a day. These facts all make the number 360 very useful. \n The circle\
    \ has been divided into 1, 2, 3, 4, 5, 6, 8, 9 10 and 12 parts \nbelow. What are\
    \ the degree measures of the resulting angles? Write \nthe degree measures down\
    \ near the indicated angles.\nDegree measures of different angles\nHow can we\
    \ measure other angles in degrees? It is for this purpose \nthat we have a tool\
    \ called a protractor that is either a circle divided \ninto 360 equal parts as\
    \ shown in Fig. 2.12 (on page 32), or a half \ncircle divided into 180 equal parts.\n\
    \nLines and Angles\n\nUnlabelled protractor\nHere is a protractor. Do you see\
    \ the straight angle at the center \ndivided into 180 units of 1 \ndegree? Only\
    \ part of the \nlines dividing the straight \nangle are visible, though!  \nStarting\
    \ \nfrom \nthe \nmarking on the rightmost \npoint of the base, there \nis a long\
    \ mark for every \n10°. From every such long \nmark, there is a medium \nsized\
    \ mark after 5°.\n Figure it out\n1.\t\nWrite the measures of the \nfollowing\
    \ angles:\na. ∠ KAL \nNotice that the vertex of this \nangle coincides with the\
    \ centre of \nthe protractor.  So the number of \nunits of 1 degree angle between\
    \ KA \nand AL gives the measure of ∠KAL. \nBy counting, we get —\n\t\n\t\n∠KAL\
    \ = 30°\nMaking use of the medium sized \nand large sized marks, is it possible\
    \ \nto count the number of units in 5s \nor 10s?\nb.\t∠WAL\nc.\t∠TAK\nA\nT\nW\n\
    L\nK\n\nLabelled protractor\nThis is a protractor that you find in your geometry\
    \ box. It would \nappear similar to the protractor above except that there are\
    \ numbers \nwritten on it. Will these make it easier to read the angles? \n\n\
    There are two sets of numbers on the protractor: one increasing \nfrom right to\
    \ left and the other increasing from left to right. Why \ndoes it include two\
    \ sets of numbers? \n Name the different angles in the figure and write their\
    \ measures. \n\nP\nO\nQ\nR\nS\nT\nU\n\nLines and Angles\n\nDid you include angles\
    \ such as ∠TOQ?\nWhich set of markings did you use — inner or outer?\nWhat is\
    \ the measure of ∠TOS?\nCan you use the numbers marked to find the angle without\
    \ \ncounting the number of markings?\nHere, OT and OS pass through the numbers\
    \ 20 and 55 on the outer \nscale. How many units of 1 degree are contained between\
    \ these \ntwo arms?\nCan subtraction be used here?\nHow can we measure angles\
    \ directly without having to subtract?\nPlace the protractor so the center is\
    \ on the vertex of the angle.\nAlign the protractor so that one the arms passes\
    \ through the 0º \nmark as in the picture below.\n\nA\nO\nB\nWhat is the degree\
    \ measure of ∠AOB? \nMake your own Protractor!\nYou may have wondered how the\
    \ different equally spaced markings are \nmade on a protractor. We will now see\
    \ how we can make some of them!\n1.\t\n\aDraw a circle of a convenient radius\
    \ on a sheet of paper. Cut out \nthe circle (Fig. 2.13). A circle or one full\
    \ turn is 360°.\n2.\t\n\aFold the circle to get two equal halves and cut it through\
    \ the \ncrease to get a semicircle. Write ‘0°’ in the bottom right corner of \n\
