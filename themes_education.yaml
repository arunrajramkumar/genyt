    7.\t Trace each figure and draw the lines of symmetry, if any:\n\t\n\t\n\n8.\t\
    \ Find the lines of symmetry for the kolam below.\n9. \t Draw the following.\n\
    \t a.\t\nA triangle with exactly one line of symmetry.\n\t b.\t\nA triangle with\
    \ exactly three lines of symmetry.\n\t c.\t\nA triangle with no line of symmetry.\n\
    Is it possible to draw a triangle with exactly two lines of symmetry?\n10. \t\
    \ Draw the following. In each case, the figure should contain at least \none curved\
    \ boundary.\n\t a.\t\nA figure with exactly one line of symmetry.\n\t b.\t\nA\
    \ figure with exactly two lines of symmetry.\n\t c.\t\nA figure with exactly four\
    \ lines of symmetry.\n11.\t\n\aCopy the following on squared paper. Complete them\
    \ so that the \nblue line is a line of symmetry. Problem (a) has been done for\
    \ you.\n(a)\n(b)\n(c)\n\nSymmetry\n\n(d)\n(e)\n(f)\n\t\nHint: For (c) and (f),\
    \ see if rotating the book helps!\n12.\tCopy the following drawing on squared\
    \ paper. Complete each one \nof them so that the resulting figure has the two\
    \ blue lines as lines \nof symmetry.\n(a)\n(b)\n(c)\n(d)\n(e)\n(f)\n\n13.\t Copy\
    \ the following on a dot grid. For each figure draw two more \nlines to make a\
    \ shape that has a line of symmetry.\n\n9.2 Rotational Symmetry\nThe paper windmill\
    \ in the picture looks \nsymmetrical but there is no line of symmetry! \nHowever,\
    \ if you fold it, the two halves will not \nexactly overlap. On the other hand,\
    \ if you rotate \nit by 90° about the red point at the centre, the \nwindmill\
    \ looks exactly the same.\nWe say that the windmill has rotational \nsymmetry.\n\
    When talking of rotational symmetry, there is always a fixed \npoint about which\
    \ the object is rotated. This fixed point is called the \ncentre of rotation.\n\
    Will the windmill above look exactly the same when rotated \nthrough an angle\
    \ of less than 90°?\nNo!\nAn angle through which a figure can be rotated to look\
    \ exactly the \nsame is called an angle of rotational symmetry, or just an angle\
    \ of \nsymmetry, for short.\n\nSymmetry\n\nFor the windmill, the angles of symmetry\
    \ are 90° (quarter turn), \n180° (half turn), 270° (three-quarter turn) and 360°\
