- theme: "Explain these Grade 6 CBSE Maths (NCERT Ganita Prakash) concepts from Chapter\
    \ 10 \"The Other Side of Zero\": A Pinch of History.\n\nUse ONLY the mathematical\
    \ facts, definitions, and rules described in the textbook excerpt below -- do\
    \ not introduce incorrect or additional mathematical claims. Make it very easy\
    \ to understand for an 11-12 year old: explain each idea simply, step by step,\
    \ and illustrate every concept with your own original real-life example a school\
    \ student would relate to.\n\nTextbook excerpt:\n\"\"\"\n10.5 A Pinch of History\n\
    Like general fractions, general integers (including zero and the \nnegative numbers)\
    \ were first conceived of and used in Asia, thousands \nof years ago, before they\
    \ eventually spread across the world in more \nmodern times.\nThe first known\
    \ instances of the use of negative numbers \noccurred in the context of accounting.\
    \ In one of China’s most \nimportant mathematical works, The Nine Chapters on\
    \ Mathematical \nArt (Jiuzhang Suanshu)—which was completed by the first or second\
    \ \ncentury CE—positive and negative numbers were represented using \nred and\
    \ black rods, much like the way we represented them using \ngreen and red tokens!\n\
    \nThe Other Side of Zero\n\nThere was a strong culture of accountancy also in\
    \ India in ancient \ntimes. The concept of credit and debit was written about\
    \ extensively \nby Kautilya in his Arthaśhāstra (c. 300 BCE), including the recognition\
    \ \nthat an account balance could be negative. The explicit use of negative \n\
    numbers in the context of accounting is seen in a number of ancient \nIndian works,\
    \ including in the Bakśhālī manuscript from around the \nyear 300 CE, where a\
    \ negative number was written using a special \nsymbol placed after the number\
    \ (rather than before the number as \nwe do today).\nThe first general treatment\
    \ of positive numbers, negative numbers, \nand zero — all on an equal footing\
    \ as equally-valid numbers on \nwhich one can perform the basic operations of\
    \ addition, subtraction, \nmultiplication, and even division — was given by Brahmagupta\
    \ in \nhis Brāhma-sphuṭa-siddhānta in the year 628 CE. Brahmagupta gave \nclear\
    \ and explicit rules for operations on all numbers — positive, \nnegative, and\
    \ zero — that essentially formed the modern way of \nunderstanding these numbers\
    \ that we still use today!\nSome of Brahmagupta’s key rules for addition and subtraction\
    \ of \npositive numbers, negative numbers and zero are given below:\nBrahmagupta’s\
    \ Rules for Addition (Brāhma-sphuṭa-siddhānta \n18.30, 628 CE)\n1.\t\nThe sum\
    \ of two positives is positive (e.g., 2 + 3 = 5). \n2.\t The sum of two negatives\
    \ is negative. To add two negatives, add \nthe numbers (without the signs), and\
    \ then place a minus sign to \nobtain the result (e.g., (– 2) + (– 3) = – 5).\n\
    3.\t\nTo add a positive number and a negative number, subtract the \nsmaller number\
    \ (without the sign) from the greater number \n(without the sign), and place the\
    \ sign of the greater number to \nobtain the result (e.g., –  5 + 3 = – 2,  2\
    \ + (– 3) = – 1 and – 3 + 5 = 2).\n4.\t The sum of a number and its inverse is\
    \ zero (e.g., 2 + (– 2) = 0). \n5.\t\nThe sum of any number and zero is the same\
    \ number (e.g., – 2 + 0 \n= – 2 and 0 + 0 = 0).\n\nBrahmagupta’s Rules for Subtraction\
    \ (Brāhma-sphuṭa-siddhānta \n18.31-18.32)\n1.\t\nIf a smaller positive is subtracted\
    \ from a larger positive, the result \nis positive (e.g., 3 – 2 = 1). \n2.\t If\
    \ a larger positive is subtracted from a smaller positive, the result \nis negative\
    \ (e.g., 2– 3 = – 1).\n3.\t\nSubtracting a negative number is the same as adding\
    \ the \ncorresponding positive number (e.g., 2 – (– 3) = 2 + 3).\n4.\t Subtracting\
    \ a number from itself gives zero (e.g., 2 – 2 = 0 and – 2 – \n(– 2) = 0).\n5.\t\
    \nSubtracting zero from a number gives the same number (e.g., – 2 \n– 0 = – 2\
    \ and 0 –  0 = 0). Subtracting a number from zero gives the \nnumber’s inverse\
    \ (e.g., 0 –  (– 2) = 2).\nOnce you understand Brahmagupta’s rules, you can do\
    \ addition \nand subtraction with any numbers whatsoever — positive, negative,\
    \ \nand zero!\n \aFigure it Out\n1.\t\nCan you explain each of Brahmagupta’s rules\
    \ in terms of Bela’s \nBuilding of Fun, or in terms of a number line? \n2.\t Give\
    \ your own examples of each rule.\nBrahmagupta was the first to describe zero\
    \ as a number on \nan equal  footing with positive numbers as well as with negative\
    \ \nnumbers, and the first to give explicit rules for performing arithmetic \n\
    operations on all such numbers, positive, negative, and zero—forming \nwhat is\
    \ now called a ring. It would change the way the world does \nmathematics.\nHowever,\
    \ it took many centuries for the rest of the world to \nadopt zero and negative\
    \ numbers as numbers. These numbers \nwere transmitted to, accepted by, and further\
    \ studied by the Arab \nworld by the 9th century, before making their way to Europe\
    \ by the \n13th century. \n\nThe Other Side of Zero\n\nSurprisingly, negative\
    \ numbers were still not accepted by many \nEuropean mathematicians even in the\
    \ 18th century. Lazare Carnot, a \nFrench mathematician in the 18th century, called\
    \ negative numbers \n‘absurd’.  But over time, zero as well as negative numbers\
    \ proved \nto be indispensable in global mathematics and science, and are \nnow\
    \ considered to be critical numbers on an equal footing with \nand as important\
    \ as positive numbers — just as Brahmagupta had \nrecommended and explicitly described\
    \ way back in the year 628 CE! \nThis abstraction of arithmetic rules on all numbers\
    \ paved the way \nfor the modern development of algebra, which we will learn about\
    \ \nin future classes.\nSu m m a r y\n\x1F\n\x1F\nThere are numbers that are less\
    \ than zero. They are written with a ‘–’ \nsign in front of them (e.g., – 2),\
    \ and are called negative numbers. They \nlie to the left of zero on the number\
    \ line.\n\x1F\n\x1F\nThe numbers ..., – 4, – 3, – 2, – 1, 0, 1, 2, 3, 4, ... are\
    \ called integers. The \nnumbers 1, 2, 3, 4, ... are called positive integers\
    \  and the numbers …, \n– 4, – 3, – 2, – 1 are called negative integers. Zero\
    \ (0) is neither positive \nnor negative.\n\x1F\n\x1F\nEvery given number has\
    \ another number associated to it which when \nadded to the given number gives\
    \ zero. This is called the additive \ninverse of the number. For example, the\
    \ additive inverse of 7 is – 7 and \nthe additive inverse of – 543 is 543.\n\x1F\
    \n\x1F\nAddition can be interpreted as Starting Position + Movement = Target \n\
    Position.\n\x1F\n\x1F\nAddition can also be interpreted as the combination of\
    \ movements or \nincreases/decreases: Movement 1 + Movement 2 = Total Movement.\n\
    \x1F\n\x1F\nSubtraction can be interpreted as Target Position – Starting Position\
    \ \n= Movement.\n\nIn general, we can add two numbers by following Brahmagupta’s\
    \ Rules \nfor Addition:\na.\t If both numbers are positive, add the numbers and\
    \ the result is a \npositive number (e.g., 2 + 3 = 5).\nb.\t If both numbers are\
    \ negative, add the numbers (without the signs), \nand then place a minus sign\
    \ to obtain the result (– 2 + (– 3) = – 5).\nc.\t If one number is positive and\
    \ the other is negative, subtract the \nsmaller number (without the sign) from\
    \ the greater number \n(without the sign), and place the sign of the greater number\
    \ to \nobtain the result (e.g., – 5 + 3 = – 2).\nd.\t A number plus its additive\
    \ inverse is zero (e.g., 2 + (– 2) = 0).\ne.\t A number plus zero gives back the\
    \ same number (e.g., – 2 + 0 = – 2).\n\x1F\n\x1F\nWe can subtract two integers\
    \ by converting the problem into an addition \nproblem and then following the\
    \ rules of addition. Subtraction of an \ninteger is the same as the addition of\
    \ its additive inverse. \n\x1F\n\x1F\nIntegers can be compared: … – 3 < – 2 <\
    \ – 1 < 0 < +1 < +2 < +3 < ... Smaller \nnumbers are to the left of larger numbers\
    \ on the number line.\n\x1F\n\x1F\nWe can give meaning to positive and negative\
    \ numbers by interpreting \nthem as credits and debits. We can also interpret\
    \ positive numbers \nas distances above a reference point like the ground level.\
    \ Similarly, \nnegative numbers can be interpreted as distances below the ground\
    \ \nlevel. When measuring temperatures in degrees Celsius, positive \ntemperatures\
    \ are those above the freezing point of water, and negative \ntemperatures are\
    \ those below the freezing point of water.\n\nThe Other Side of Zero\n\nIntegers:\
    \ Snakes and Ladders\nRules\n•\t This is a two player game. Each player has 1\
