    \ Numbers can Tell us Things\nWhat are these numbers telling us?\nSome children\
    \ in a park are standing in a line. Each one says a number.\n  What do you think\
    \ these numbers mean?\n\t\nThe children now rearrange themselves, and again each\
    \ one \nsays a number based on the arrangement.\nMath \nTalk\n\nDid you figure\
    \ out what these numbers represent?\nHint: \aCould their heights be playing a\
    \ role?\nA child says ‘1’ if there is only one taller child standing next to them.\
    \ \nA child says ‘2’ if both the children standing next to them are taller. \n\
    A child says ‘0’, if neither of the children standing next to them are taller.\
    \ \nThat is each person says the number of taller neighbours they have.\n  Try\
    \ answering the questions below and share your reasoning.\n1.\t\aCan the children\
    \ rearrange themselves so that the children \nstanding at the ends say ‘2’?\n\
    2.\t\aCan we arrange the children in a line so that all would say \nonly 0s?\n\
    3.\t\aCan two children standing next to each other say the same \nnumber? \n4.\t\
    \aThere are 5 children in a group, all of different heights. Can \nthey stand\
    \ such that four of them say ‘1’ and the last one says \n‘0’? Why or why not?\n\
    5.\t\aFor this group of 5 children, is the sequence 1, 1, 1, 1, 1 possible? \n\
    6.\t\aIs the sequence 0, 1, 2, 1, 0 possible? Why or why not?\n7.\t\aHow would\
    \ you rearrange the five children so that the \nmaximum number of children say\
    \ ‘2’?\nMath \nTalk\n\nNumber Play\n\n3.2 Supercells\nObserve the numbers written\
    \ in the table below. Why are some \nnumbers coloured? Discuss.\n\nA cell is coloured\
    \ if the number in it is larger than its adjacent \ncells. The number 626 is coloured\
    \ as it is larger than 577 and 345, \nwhereas 200 is not coloured as it is smaller\
    \ than 577. The number \n198 is coloured as it has only one adjacent cell with\
    \ 109 in it, and 198 \nis larger than 109.\n  Figure it Out\n1.\t Colour or mark\
    \ the supercells in the table below.\n6828\n\n9435\n3780\n3708\n7308\n8000\n5583\n\
    \n2.\t Fill the table below with only 4-digit numbers such that the \nsupercells\
    \ are exactly the coloured cells.\n5346\n1258\n9635\n3.\t Fill the table below\
    \ such that we get as many supercells as possible. \nUse numbers between 100 and\
    \ 1000 without repetitions.\n4.\t Out of the 9 numbers, how many supercells are\
    \ there in the table \nabove? ___________\n5.\t Find out how many supercells are\
    \ possible for different \nnumbers of cells. \nDo you notice any pattern? What\
    \ is the method to fill a given \ntable to get the maximum number of supercells?\
    \ Explore and \nshare your strategy.\nMath \nTalk\n\n6.\t Can you fill a supercell\
    \ table without repeating numbers such \nthat there are no supercells? Why or\
    \ why not?\n7.\t Will the cell having the largest number in a table always be\
    \ a \nsupercell? Can the cell having the smallest number in a table \nbe a supercell?\
    \ Why or why not?\n8.\t Fill a table such that the cell having the second largest\
    \ number \nis not a supercell.\n9.\t Fill a table such that the cell having the\
    \ second largest \nnumber is not a supercell but the second smallest number is\
    \ \na supercell. Is it possible?\n10.\tMake other variations of this puzzle and\
    \ challenge your \nclassmates.\nLet’s do the supercells activity with more rows.\n\
    Here the neighbouring cells are those that are immediately to the \nleft, right,\
    \ top and bottom.\n\aThe rule remains the same­: a \ncell becomes a supercell\
    \ if the \nnumber in it is greater than all \nthe numbers in its neighbouring\
    \ \ncells. In Table 1, 8632 is greater \nthan all its neighbours 4580, \n8280,\
    \ 4795 and 1944.\n  Complete Table 2 with 5-digit \nnumbers whose digits are ‘1’,\
