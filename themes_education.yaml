    \ Is there a way to \nsuperimpose and check? Can this superimposition be done\
    \ by \nfolding? \nEach of these equal angles formed are called right angles. So,\
    \ a \nstraight angle contains two right angles.\nWhy shouldn't you \nargue with\
    \ a 90 ̊ \nangle?\nBecause they're \nalways right.\n If a straight angle is formed\
    \ by half of a full turn, how much of a \nfull turn will form a right angle? \b\
    \nObserve that a right angle resembles the shape of an ‘L’. An angle \nis a right\
