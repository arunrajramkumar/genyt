    \ Therefore, we choose the scale so that 1 unit represents \n10 crores. The bar\
    \ graph for this choice is shown in the figure. So a \nbar of length 5 units represents\
    \ 50 crores and of 8 units represents \n80 crores.\n••\nOn the basis of this bar\
    \ graph, what may be a few questions you \nmay ask your friends?\n••\nHow much\
    \ did the population of India increase over 50 years? \nHow much did the population\
    \ increase in each decade?\n\n4.4 Drawing a Bar Graph\nIn a previous example,\
    \ Shri Nilesh prepared a frequency table \nrepresenting the sweet preferences\
    \ of the students in his class. Let’s \ntry to prepare a bar graph to present\
    \ his data —\n1.\t\n\aFirst, we draw a horizontal \nline and a vertical line.\
    \ On \nthe horizontal line, we will \nwrite the name of each of \nthe sweets,\
    \ equally spaced, \nfrom which the bars will \nrise in accordance with \ntheir\
    \ frequencies; and on \nthe vertical line we will write the frequencies representing\
    \ the \nnumber of students. \n2.\t\nWe must choose a scale. That means we must\
    \ decide how many \nstudents will be represented by a unit length of a bar so\
    \ that \nit fits nicely on our paper. Here, we will take 1 unit length to \nrepresent\
    \ 1 student. \n3.\t\nFor jalebi, we therefore need to draw a bar having a height\
    \ of 6 \nunits (which is the frequency of the sweet jalebi), and similarly \n\
    for the other sweets we have to draw bars as high as their \nfrequencies. \nSweet\n\
    No. of Students\nJalebi\n\nGulab jamun\n\nGujiya\n\nBarfi \n\nRasgulla\n\nGanita\
    \ Prakash | Grade 6\b\n\n4.\t\nWe, therefore, get a bar graph as shown below —\n\
    Sweets\nSweet preferences of students\n\nNumber of students\nJalebi\nGulab jamun\n\
    Gujia \nBarfi\nRasgulla\n\t\nWhen the frequencies are larger and we cannot use\
    \ the scale of \n1 unit length = 1 number (frequency), we need to choose a different\
    \ \nscale like we did in the case of pictographs. \nExample: The number of runs\
    \ scored by Smriti in each of the \n8 matches are given in the table below:\n\
    Match\nMatch \n\nMatch \n\nMatch \n\nMatch \n\nMatch \n\nMatch \n\nMatch \n\n\
    Match \n\nRuns\n\nIn this example, the minimum score is 0 and the maximum score\
    \ \nis 100. Using a scale of 1 unit length = l run would mean that we \nhave to\
    \ go all the way from 0 to 100 runs in steps of l. This would \nbe unnecessarily\
    \ tedious. Instead, let us use a scale where 1 unit \nlength = 10 runs. We mark\
    \ this scale on the vertical line and draw \nthe bars according to the scores\
    \ in each match. We get the following \nbar graph representing the above data.\n\
    \nData Handling and Presentation\n\nMatch 1\nMatch 2\nMatch 3\nMatch 4\nMatch\
    \ 5\nMatch 6\nMatch 7\nMatch 8\nMatches\n\nRuns\nRuns scored by Smriti\nExample:\
    \ The following table shows the monthly expenditure of \nImran’s family on various\
    \ items:\nItems\nExpenditure (in `)\nHouse rent\nFood\nEducation\nElectricity\n\
    Transport\nMiscellaneous\n3000\n3400\n 800\n 400\n 600\n 1200\n\t\nTo represent\
    \ this data in the form of a bar graph, here are the steps —\n••\nDraw two perpendicular\
