- theme: "Explain these Grade 6 CBSE Maths (NCERT Ganita Prakash) concepts from Chapter\
    \ 2 \"Lines and Angles\": Point & Line Segment.\n\nUse ONLY the mathematical facts,\
    \ definitions, and rules described in the textbook excerpt below -- do not introduce\
    \ incorrect or additional mathematical claims. Make it very easy to understand\
    \ for an 11-12 year old: explain each idea simply, step by step, and illustrate\
    \ every concept with your own original real-life example a school student would\
    \ relate to.\n\nTextbook excerpt:\n\"\"\"\n2.1 Point\nMark a dot on the paper\
    \ with a sharp tip of a pencil. The sharper the \ntip, the thinner will be the\
    \ dot. This tiny dot will give you an idea of \na point. A point determines a\
    \ precise location, but it has no length, \nbreadth or height. Some models for\
    \ a point are given below. \nThe tip of a \ncompass\nThe sharpened \nend of a\
    \ pencil \nThe pointed \nend of a needle \nIf you mark three points on a piece\
    \ of paper, \nyou may be required to distinguish these three \npoints. For this\
    \ purpose, each of the three points \nmay be denoted by a single capital letter\
    \ such as \nP\nZ\nT\n\nZ, P and T. These points are read as ‘Point Z’, ‘Point\
    \ P’ and ‘Point T’. Of \ncourse, the dots represent precise locations and must\
    \ be imagined to be \ninvisibly thin.\n\n2.2 Line Segment\nFold a piece of paper\
    \ and unfold it. Do you \nsee a crease? This gives the idea of a line \nsegment.\
    \ It has two end points, A and B.\nMark any two points A and B on a sheet of \n\
    paper. Try to connect A to B by various \nroutes  (Fig. 2.1).\nWhat is the shortest\
    \ route from A to B? \nThis shortest path from point A to Point B \n(including\
    \ A and B) as shown here is called \nthe line segment from A to B. It is denoted\
    \ by \neither AB or BA. The points A and B are called \nthe end points of the\
    \ line segment AB.\n\"\"\""
