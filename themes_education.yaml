    \ \n.\n In which group will each child get more chikki?\n1 chikki divided between\
    \ 2 children or 5 chikkis divided among \n8 children.\nMukta: So, we must compare\
    \ 1\n2  and 5\n8 . Which is more?\nShabnam: \aWell, we have seen that 1\n2  =\
    \ 4\n8 ; and clearly 4\n8  < 5\n8 .  So, the \nchildren for whom 5 chikkis is\
