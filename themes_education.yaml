    length of 1\n2 ?\n4.\t\n\x03How many pieces of length 1\n6  will make a length\
    \ of 1\n3 ?\n1 UNIT\n\nFractions\n\nWe can extend this idea to make a fraction\
    \ wall up to the fractional \nunit 1\n10. (This fraction wall is given at the\
    \ end of the book.)\n1 UNIT\n\n Figure it Out\b\n\t\n1. Are 3\n6 , 4\n8 , 5\n\
    10  equivalent fractions? Why?\n\t\n2. Write two equivalent fractions for 2\n\
    6 .\n\t\n3. 4\n6  =  \n =  \n =  \n = ............ (Write as many as you can)\n\
    Understanding equivalent fractions using equal shares \nOne roti was shared equally\
    \ by four children. \nWhat fraction of the whole did each child get? \nThe adjoining\
    \ picture shows the division of a \nroti among four children.\nFraction of roti\
    \ each child got is 1\n4 .\nThe four shares must be \nequal to each other!\n\n\
    You can also express this event through division facts, addition \nfacts, and\
    \ multiplication facts. \nThe division fact is 1 ÷ 4 = 1\n4 .\nThe addition fact\
    \ is 1 = 1\n4  + 1\n4  + 1\n4  + 1\n4 .\nThe multiplication fact is 1 = 4 × 1\n\
    4 .\n Figure it Out\n1.\t Three rotis are shared equally by four children. Show\
    \ the division \nin the picture and write a fraction for how much each child gets.\
    \ \nAlso, write the corresponding division facts, addition facts, and, \nmultiplication\
    \ facts.\n\aFraction of roti each child gets is ______.  \nDivision fact: \nAddition\
    \ fact: \nMultiplication fact:\nCompare your picture and answers with your classmates!\n\
    2.\t \aDraw a picture to show how much each child gets when 2 rotis \nare shared\
    \ equally by 4 children. Also, write the corresponding \ndivision facts, addition\
    \ facts, and multiplication facts.\n3.\t Anil was in a group where 2 cakes were\
    \ divided equally among \n5  children. How much cake would Anil get?\nWhat if\
    \ we put two such groups \ntogether? one group where \n2 cakes are divided equally\
    \ \nbetween 5 children, and another \ngroup again with 4 cakes and \n10 children.\n\
    Now, if there are 10 children \nin my group, how many \ncakes will I need so that\
