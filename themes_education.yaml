- theme: "Explain these Grade 6 CBSE Maths (NCERT Ganita Prakash) concepts from Chapter\
    \ 7 \"Fractions\": Addition and Subtraction of Fractions & A Pinch of History.\n\
    \nUse ONLY the mathematical facts, definitions, and rules described in the textbook\
