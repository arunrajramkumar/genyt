    \ two dice at a time. One dice has numbers \nfrom + 1 to + 6 and the other dice\
    \ has numbers from – 1 to – 6. \n•\t After each roll of the two dice, the player\
    \ can add or subtract \nthem in any order and then move the steps that indicate\
    \ the \nresu\n\"\"\""
