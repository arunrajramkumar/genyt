    \ Make it very easy to understand for an 11-12 year old: explain each idea simply,\
    \ step by step, and illustrate every concept with your own original real-life\
    \ example a school student would relate to.\n\nTextbook excerpt:\n\"\"\"\n7.8\
    \ Addition and Subtraction of Fractions\nMeena’s father made some chikki. Meena\
    \ ate 1\n\nof it and her younger brother ate 1\n4 of it. How \nmuch of the total\
    \ chikki did Meena and her \nbrother eat together?\nWe can arrive at the answer\
    \ by visualising it. Let us take a piece \nof chikki and divide it into two halves\
    \ first like this.\nMeena ate 1\n2 of it as \nshown in the picture. \nLet us now\
    \ divide the \nremaining half into two further halves as shown. Each of these\
    \ \npieces is 1\n4 of the whole chikki.\nMeena’s brother ate 1\n\nof the whole\
    \ chikki, as is \nshown in the picture. \nThe total chikki eaten \nis 1\n2 (by Meena)\
    \ and 1\n4 (by her \nbrother)\n\aThe total chikki eaten  \n\t   = 1\n2 + 1\n\n\
      = 1\n4 + 1\n4 + 1\n\n  = 3 × 1\n4 = 3\n4.    \nHow much of the total chikki\
    \ is remaining? \nMeena ate\nMeena ate\nBrother ate\nTotal chikki eaten\n\nAdding\
    \ fractions with the same fractional unit or \ndenominator\nExample: Find the\
    \ sum of 2\n5 and 1\n5. \nLet us represent both using the rectangular strips.\
    \ In both fractions, \nthe fractional unit is the same 1\n5 , so, each strip will\
    \ be divided into \n5 equal parts. \nSo 2\n5  will be represented as —\nAnd 1\n\
    5  will be represented as —\nAdding the two given fractions is the same as finding\
    \ out the total \nnumber of shaded parts, each of which represent the same fractional\
    \ \nunit 1\n5. \nIn this case, the total number of shaded parts is 3. Since, each\
    \ \nshaded part represents the fractional unit 1\n5 , we see that the 3 shaded\
    \ \nparts together represent the fraction 3\n5.\nTherefore,\t 2\n5 + 1\n5 = 3\n\
    5?\nExample: Find the sum of  4\n7  and  6\n7.\nLet us represent both again using\
    \ the rectangular strip model. Here in \nboth fractions, the fractional unit is\
    \ the same, i.e., 1\n7 , so each strip will \nbe divided into 7 equal parts.\n\
    Then 4\n7  will be represented as —\n\nFractions\n\nand 6\n7 will be represented\
    \ as —\nIn this case, the total number of \nshaded parts is 10, and each shaded\
    \ part \nrepresents the fractional unit 1\n7, so, the \n10 shaded parts together\
    \ represent the \nfraction 10\n7   as seen here.\n\t\n\t\n\t\n\t\n\t\n\t\nTherefore,\
    \ 4\n7 + 6\n7 = 10\n\n                                                  = 1 +\
    \ 3\n\n                                                  = 1 3\n7.\n\t\n\t\n\t\
    \n \aTry adding 4\n7 + 6\n7 using a number line. Do you get the same answer?\n\
    Adding fractions with different fractional units or \ndenominators\nExample: Find\
    \ the sum of  1\n4  and  1\n3.\nTo add fractions with different fractional units,\
    \ first convert the \nfractions into equivalent fractions with the same denominator\
    \ or \n While adding fractions \nwith the same fractional \nunit, just add the\
    \ number of \nfractional units from each \nfraction.\n\nfractional unit. In this\
    \ case, the common denominator can be made \n3 × 4 = 12, i.e., we can find equivalent\
    \ fractions with fractional unit 1\n12.\nLet us write the equivalent fraction\
    \ for each given fraction.\n\n4  = 1 × 3\n4 × 3  = 3\n12 , 1\n3  = 1 × 4\n3 ×\
    \ 4  = 4\n12 .\nNow, 3\n12   and 4\n12  have the same fractional unit, i.e., 1\n\
    12 .\nTherefore, 1\n4  + 1\n3  = 3\n12  + 4\n12  = 7\n12 .\nThis method of addition,\
    \ which works for adding any number of \nfractions, was first explicitly described\
    \ in general by Brahmagupta \nin the year 628 CE! We will describe the history\
    \ of the development \nof fractions in more detail later in the chapter. For now,\
    \ we simply \nsummarise the steps in Brahmagupta’s method for addition of \nfractions.\n\
    Brahmagupta’s method for adding fractions \n1.\t Find equivalent fractions so\
    \ that the fractional unit is common \nfor all fractions. This can be done by\
    \ finding a common multiple \nof the denominators (e.g., the product of the denominators,\
    \ or the \nsmallest common multiple of the denominators). \n2.\t Add these equivalent\
    \ fractions with the same fractional units. \nThis can be done by adding the numerators\
    \ and keeping the same \ndenominator. \n3.\t Express the result in lowest terms\
    \ if needed.\nLet us carry out another example of Brahmagupta’s method. \nExample:\
    \ Find the sum of 2\n3 and 1\n5.\nThe denominators of the given fractions are\
    \ 3 and 5. The lowest \ncommon multiple of 3 and 5 is 15. Then we see that\n\n\
    3 = 2 × 5\n3 × 5  = 10\n15 , 1\n5 = 1 × 3\n5 × 3  = 3\n15 .\n\nFractions\n\nTherefore,\
    \  2\n3  + 1\n5  = 10\n15  + 3\n15  = 13\n15 .\nExample: Find the sum of 1\n6\
    \  and 1\n3.\nThe smallest common multiple of 6 and 3 is 6. \n\n6  will remain\
    \ 1\n6 .\n\n3  = 1 × 2\n3 × 2  = 2\n\nTherefore, 1\n6  + 1\n3  = 1\n6  + 2\n6\
    \  = 3\n6.\nThe fraction \n\n6  can now be re-expressed in lowest terms, if \n\
    desired. This can be done by dividing both the numerator and \ndenominator by\
    \ 3 (the biggest common factor of 3 and 6):\n\n6  = 3 ÷ 3\n6 ÷ 3  = 1\n2.\nTherefore,\
    \ 1\n6  + 1\n3  = 1\n2.\n Figure it Out\n1.\t Add the following fractions using\
    \ Brahmagupta’s method:\na.  2\n7 + 5\n7 + 6\n\nb.  3\n4 + 1\n\nc.  2\n3 + 5\n\
    \nd.  2\n3 + 2\n\ne.  3\n4 + 1\n3 + 1\n\nf.  2\n3 + 4\n\ng.  4\n5 + 2\n\nh.  3\n\
    5 + 5\n\n i.  9\n2 + 5\n\n j.  8\n3 + 2\n\nk.  3\n4 + 1\n3 + 1\n\nl.  2\n3 + 4\n\
    5 + 3\n7 \t m.  9\n2 + 5\n4 + 7\n\n2.\t Rahim mixes 2\n3 litres of yellow paint\
    \ with 3\n4 litres of blue paint to \nmake green paint. What is the volume of\
    \ green paint he has made?\n3.\t Geeta bought 2\n5 meter of lace and Shamim bought\
    \ 3\n4 meter of the \nsame lace to put a complete border on a table cloth whose\
    \ perimeter \nis 1 meter long. Find the total length of the lace they both have\
    \ \nbought. Will the lace be sufficient to cover the whole border?\n\nSubtraction\
    \ of fractions with the same fractional unit or \ndenominator\nBrahmagupta’s method\
    \ also applies when subtracting fractions!  \nLet us start with the problem of\
    \ subtracting 4\n7 from 6\n7, i.e., what is \n\n7 – 4\n7?\nTo solve this problem,\
    \ we can again use the rectangular strips. \nIn both fractions, the fractional\
    \ unit is the same, i.e., 1\n7. Let us first \nrepresent the bigger fraction using\
    \ a rectangular strip model as \nshown: \n\nEach shaded part represents 1\n7.\
    \ Now, we need to subtract 4\n7. To do \nthis let us remove 4 of the shaded parts:\n\
    So, we are left with 2 shaded parts, i.e., 6\n7 – 4\n7 = 2\n7.\nTry doing this\
    \ same exercise using the number line.\nWe can do this here directly \nbecause\
    \ both fractions have \nthe same fractional units.\nFractional parts to \nbe removed.\
    \ \n\nFractions\n\n Figure it Out\n\t\n1.\t\n\n8 – 3\n\n2.\t\n\n9 – 5\n\n3.\t\n\
    \ 10\n27  – 1\n\nSubtraction of fractions with different fractional units or \n\
    denominators\nExample: What is  3\n4 – 2\n3?\nAs we already know the procedure\
    \ for subtraction of fractions with \nthe same fractional units, let us convert\
    \ each of the given fractions \ninto equivalent fractions with the same fractional\
    \ units.\n\n4 = (3×3)\n(4×3)  = 9\n\nYes! By doing this we can easily \nsubtract\
    \ the two fractions.\nThink! Why did we choose to \nmultiply both the numerator\
    \ and \ndenominator by 3?\nAgain! Why did we choose to multiply \nboth the numerator\
    \ and denominator \nhere by 4?\nand similarly, \n\n3  = (2×4)\n(3×4)  = 8\n12\
    \ .\nTherefore, 3\n4 – 2\n3  = 9\n12  – 8\n12  = 1\n12 .\nBrahmagupta’s method\
    \ for subtracting two fractions —\n1.\t\n\aConvert the given fractions into equivalent\
    \ fractions with the \nsame fractional unit, i.e., the same denominator. \n2.\t\
    \n\aCarry out the subtraction of fractions having the same fractional \nunits.\
    \ This can be done by subtracting the numerators and \nkeeping the same denominator.\
    \ \n3.\t\nSimplify the result into lowest terms if needed.\n\n  Figure it Out\n\
    1.\t Carry out the following subtractions using Brahmagupta’s method: \na. 8\n\
    15  – 3\n\nb. 2\n5  – 4\n\n c. 5\n6 – 4\n\nd. 2\n3 – 1\n\n2.\t Subtract as indicated:\n\
    a. 13\n4  from 10\n\nb. 18\n5  from 23\n\nc. 29\n7  from 45\n\n3.\t Solve the\
    \ following problems:\n\t\n\t\na.\t\n\aJaya’s school is 7\n10  km from her home.\
    \ She takes an auto for \n\n2  km from her home daily, and then walks the remaining\
    \ \ndistance to reach her school. How much does she walk daily \nto reach the\
    \ school?   \n\t\n\t\nb. \t \aJeevika takes 10\n3  minutes to take a complete\
    \ round of the \npark and her friend Namit takes 13\n4  minutes to do the same.\
    \ \nWho takes less time and by how much?\n\n7.9 A Pinch of History\nDo you know\
    \ what a fraction was called in ancient India? It was \ncalled bhinna in Sanskrit,\
    \ which means ‘broken’. It was also called \nbhaga or ansha meaning ‘part’ or\
    \ ‘piece’. \nThe way we write fractio\n\"\"\""
