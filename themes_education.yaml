    \ black lines were more than 1?\n\t Write down all the fractions you marked on\
    \ the number line \nearlier. \n\t\nNow, let us classify these in two groups: \n\
    Lengths less than 1 unit\nLengths more than 1 unit\n  Did you notice something\
    \ common between the fractions that \nare greater than 1?\nIn all the fractions\
    \ that are less than 1 unit, the numerator is \nsmaller than the denominator,\
    \ while in the fractions that are more \nthan 1 unit, the numerator is larger\
    \ than the denominator.\nWe know that 3\n2 , 5\n2  and 7\n2  are all greater than\
