    \ 9 \"Symmetry\": Line of Symmetry & Rotational Symmetry.\n\nUse ONLY the mathematical\
    \ facts, definitions, and rules described in the textbook excerpt below -- do\
    \ not introduce incorrect or additional mathematical claims. Make it very easy\
    \ to understand for an 11-12 year old: explain each idea simply, step by step,\
    \ and illustrate every concept with your own original real-life example a school\
    \ student would relate to.\n\nTextbook excerpt:\n\"\"\"\n9.1 Line of Symmetry\n\
    Figure (a) shows the picture of a blue triangle with a dotted line. \nWhat if\
    \ you fold the triangle along the dotted line? Yes, one half \nof the triangle\
    \ covers the other half completely. These are called \nmirror halves! \n(a)\n\
    (b)\nWhat about Figure (b) with the four puzzle pieces and a dotted line \npassing\
    \ through the middle? Are they mirror halves? No, when we fold \nalong the line,\
    \ the left half does not exactly fit over the right half.\nA line that cuts a\
    \ figure into two \tparts that exactly overlap when \nfolded along that line is\
    \ called a line of symmetry of the figure.\n Figure it Out \n1.\t Do you see any\
    \ line of symmetry in the figures at the start of the \nchapter? What about in\
    \ the picture of the cloud?\n2.\t For each of the following figures, identify\
    \ the line(s) of symmetry \nif it exists.\n\nFigures with more than one line of\
    \ symmetry\nDoes a square have only one line of symmetry?\nTake a square piece\
    \ of paper. By folding, find all its lines of symmetry. \nFold 1\nFold 2\nFold\
    \ 4\nFold 3\nHere are the different folds giving different lines of symmetry.\n\
    •\t Fold the paper into half vertically.\n•\t Fold it again into half horizontally\
    \ (i.e., you have folded it \ntwice). Now open out the folds.\nVertical Fold\n\
    Horizontal Fold\nAgain fold the square into half (for a third time now), but this\
    \ \ntime along a diagonal, as shown in the figure. Again, open it.\n\nSymmetry\n\
    \nFold it into half (for the fourth time), but this time along the other \ndiagonal,\
    \ as shown in the figure. Open out the fold.\n  Is there any other way to fold\
    \ the square so that the two halves \noverlap? How many lines of symmetry does\
    \ the square shape have?\n\t\nThus, figures can have multiple lines of symmetry.\
    \ The figures \nbelow also have multiple lines of symmetry. Can you find them\
    \ all?\n  We saw that the diagonal of a square is also a line of symmetry. \n\
    Let us take a rectangle that is not a square. Is its diagonal a line of \nsymmetry?\n\
    \t First, see the rectangle and answer this \nquestion. Then, take a rectangular\
    \ piece of \npaper and check if the two parts overlap by \nfolding it along its\
    \ diagonal. What do you \nobserve?\nReflection\nSo far we have been saying that\
    \ when we fold a figure along a line of \nsymmetry, the two parts overlap completely.\
    \ We could also say that \nthe part of the figure on one side of the line of symmetry\
    \ is reflected \nby the line to the other side; similarly, the part of the figure\
    \ on the \nother side of the line of symmetry is reflected to the first side!\
    \ Let us \nunderstand this by labeling some points on the figure.\nThe figure\
    \ shows a square with its corners labeled A, B, C and D. \nLet us first consider\
    \ the vertical line of symmetry. When we reflect \n\nthe square along this line,\
    \ the points B, C on the right get reflected to \nthe left side and occupy the\
    \ positions occupied earlier by A, D. What \nhappens to the points A, D? A occupies\
    \ the position occupied by B and \nD that of C!\nA\nD\nB\nC\n  What if we reflect\
    \ along the diagonal from A to C? Where do \npoints A, B, C and D go? What if\
    \ we reflect along the horizontal line of \nsymmetry?\nA figure that has a line\
    \ or lines of symmetry is thus, also said to have \nreflection symmetry.\nGenerating\
    \ shapes having lines of symmetry\nSo far we have seen symmetrical figures and\
    \ asymmetrical \nfigures. How does one generate such symmetrical figures? Let\
    \ us \nexplore this.\nInk Blot Devils\nYou enjoyed doing this earlier in Class\
    \ 5. Take a piece of paper. Fold \nit in half. Open the paper and spill a few\
    \ drops of ink (or paint) on \none half.\nNow press the halves together and then\
    \ open the paper again.\n•\t What do you see?\n•\t Is the resulting figure symmetric?\n\
    •\t If yes, where is the line of symmetry?\n•\t Is there any other line along\
    \ which it can be folded to produce \ntwo identical parts?\n•\t Try making more\
    \ such patterns.\n\nSymmetry\n\nPaper Folding and Cutting \nHere is another way\
    \ of making symmetric shapes!\nIn these two figures, a sheet of paper is \nfolded\
    \ and a cut is made along the dotted \nline shown. Draw a sketch of how the paper\
    \ \nwill look when unfolded.\nDo you see a line of symmetry in this \nfigure?\
    \ What is it?\nMake different symmetric shapes by folding and cutting.\nThere\
    \ are more ways of folding and cutting pieces of paper to get \nsymmetric shapes!\n\
    Use thin rectangular coloured \npaper. Fold it several times and \ncreate some\
    \ intricate patterns by \ncutting the paper, like the one shown \nhere. Identify\
    \ the lines of symmetry \nin the repeating design. Use such \ndecorative paper\
    \ cut-outs for festive \noccasions.\n\a\n  Figure it Out \n\t\nPunching Game\n\
    \t\n\aThe fold is a line of symmetry. Punch holes at different locations of \n\
    a folded square sheet of paper using a punching machine and create \ndifferent\
    \ symmetric patterns.\n\n1.\t In each of the following figures, a hole was punched\
    \ in a folded \nsquare sheet of paper and then the paper was unfolded. Identify\
    \ \nthe line along which the paper was folded.\n\t\nFigure (d) was created by\
    \ punching a single hole. How was the \npaper folded?\n      \t\n      \na.\n\
    b.\nc.\nd.\n2. \t \aGiven the line(s) of symmetry, find the other hole(s):\na.\n\
    b.\nc.\nd.\ne.\n3.\t Here are some questions on paper cutting. \n\t\nConsider\
    \ a vertical fold. We represent it this way:\n\t\nVertical Fold\n\nSymmetry\n\n\
    Similarly, a horizontal fold is represented as follows:\nHorizontal Fold\n4.\a\
    \t After each of the following cuts, predict the shape of the \nhole when the\
