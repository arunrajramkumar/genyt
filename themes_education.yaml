    4580\n8632\n8280\n3446\n 5785\n1944\n5805\n6034\nTable 1\nTable 2\n96,301\n36,109\n\
    13,609\n60,319\n19,306\n60,193\n10,963\n\nNumber Play\n\nThe smallest even number\
    \ in the table is ____________.\nThe smallest number greater than 50,000 in the\
