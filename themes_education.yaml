- theme: "Explain these Grade 6 CBSE Maths (NCERT Ganita Prakash) concepts from Chapter\
    \ 3 \"Number Play\": Playing with Number Patterns & An Unsolved Mystery — the\
    \ Collatz Conjecture!.\n\nUse ONLY the mathematical facts, definitions, and rules\
    \ described in the textbook excerpt below -- do not introduce incorrect or additional\
    \ mathematical claims. Make it very easy to understand for an 11-12 year old:\
    \ explain each idea simply, step by step, and illustrate every concept with your\
    \ own original real-life example a school student would relate to.\n\nTextbook\
    \ excerpt:\n\"\"\"\n3.9 Playing with Number Patterns\nHere are some numbers arranged\
    \ in some patterns. Find out the \nsum of the numbers in each of the below figures.\
    \ Should we add \nthem one by one or can we use a quicker way? \n Share and discuss\
    \ in class the different methods each one of you \nused to solve these questions.\
    \ \n\na.\nb.\nMath \nTalk\n\n32 32 32 32 32 32 32 32\n32 32 32 32 32 32 32 32\n\
    32 32 32 32 32 32 32 32\n32 32 32 32 32 32 32 32\n64 64 64\n\n64 64 64\n\n64 64\
    \ 64\n\n64 64 64\n\nc.\nd.\n\n1000\n\n25 35\n\ne.\nf.\n\n3.10 An Unsolved Mystery\
    \ — the Collatz Conjecture!\nLook at the sequences below—the same rule is applied\
    \ in all the \nsequences:\na.\t 12, 6, 3, 10, 5, 16, 8, 4, 2, 1\nb.\t 17, 52,\
    \ 26, 13, 40, 20, 10, 5, 16, 8, 4, 2, 1\nc.\t 21, 64, 32, 16, 8, 4, 2, 1\nd.\t\
    \ 22, 11, 34, 17, 52, 26, 13, 40, 20, 10, 5, 16, 8, 4, 2, 1\nDo you see how these\
    \ sequences were formed? \n\nNumber Play\n\nThe rule is: one starts with any number;\
    \ if the number is even, \ntake half of it; if the number is odd, multiply it\
    \ by 3 and add 1; \nrepeat.\nNotice that all four sequences above eventually reached\
    \ the \nnumber 1. In 1937, the German mathematician, Lothar Collatz \nconjectured\
    \ that the sequence will always reach 1, regardless of \nthe whole number you\
    \ start with. Even today — despite many \nmathematicians working on it — it remains\
    \ an unsolved problem as \nto whether Collatz’s conjecture is true! Collatz’s\
    \ conjecture is one of \nthe most famous unsolved problems in mathematics.\n Make\
    \ some more Collatz sequences like those above, starting \nwith your favourite\
    \ whole numbers. Do you always reach 1?  \nDo you believe the conjecture of Collatz\
    \ that all such sequences \nwill eventually reach 1?  Why or why not?\n\"\"\""
