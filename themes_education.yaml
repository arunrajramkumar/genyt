- theme: "Explain these Grade 6 CBSE Maths (NCERT Ganita Prakash) concepts from Chapter\
    \ 4 \"Data Handling and Presentation\": Artistic and Aesthetic Considerations.\n\
    \nUse ONLY the mathematical facts, definitions, and rules described in the textbook\
    \ excerpt below -- do not introduce incorrect or additional mathematical claims.\
    \ Make it very easy to understand for an 11-12 year old: explain each idea simply,\
    \ step by step, and illustrate every concept with your own original real-life\
    \ example a school student would relate to.\n\nTextbook excerpt:\n\"\"\"\n4.5\
    \ Artistic and Aesthetic Considerations\nIn addition to the steps described in\
    \ previous sections, there are \nalso some other more artistic and aesthetic aspects\
    \ one can consider \nwhen preparing visual presentations of data to make them\
    \ more \ninteresting and effective. First, when making a visual presentation \n\
    of data such as a pictograph or bar graph, it is important to make \nit fit in\
    \ the intended space; this can be controlled, for example, by \nchoosing the scale\
    \ appropriately, as we have seen earlier. It is also \ndesirable to make the data\
    \ presentation visually appealing and \neasy-to-understand, so that the intended\
    \ audience appreciates the \ninformation being conveyed.\n\t\nLet us consider\
    \ an example. Here is a table naming the tallest \nmountain on each continent,\
    \ along with the height of each mountain \nin meters.\nContinent\nAsia\nSouth\
    \ \nAmerica\nNorth \nAmerica\nAfrica\nEurope Antarctica\nAustralia\nTallest \n\
    Mountain Everest Aconcagua\nDenali\nKiliman-\njaro \nElbrus\nVinson \nMassif\n\
    Koscuiszko\nHeight\n8848m\n6962m\n6194m\n5895m\n5642m\n4892m\n2228m\n\t\nHow much\
    \ taller is Mount Everest than Mount Koscuiszko? Are \nMount Denali and Mount\
    \ Kilimanjaro very different in height? This \nis not so easy to quickly discern\
    \ from a large table of numbers.\n\t\nAs we have seen earlier, we can convert\
    \ the table of numbers \ninto a bar graph, as shown on the right.  Here, each\
    \ value is drawn \nas a horizontal box. These are longer or shorter depending\
    \ on the \nnumber they represent. This makes it easier to compare the heights\
    \ \nof all these mountains at a glance.\n\nGanita Prakash | Grade 6\b\n\nAsia\
    \ — Everest \nSouth America — Aconcagua  \nNorth America — Denali\nAfrica — Kilimanjaro\
    \ \nEurope — Elbrus\nAntarctica — Vinson Massif \nAustralia — Koscuiszko\n\n1000\n\
    2000\n3000 4000\n5000 6000 7000 8000 9000\n\t\nHowever, since the boxes represent\
    \ heights, it is better and more \nvisually appealing to rotate the picture, so\
    \ that the boxes grow \nupward, vertically from the ground like mountains. A bar\
    \ graph \nwith vertical bars is also called a column graph. Columns are the \n\
    pillars you find in a building that hold up the roof. \n\t\nBelow is a column\
    \ graph for our table of tallest mountains. From \nthis column graph, it becomes\
    \ easier to compare and visualise the \nheights of the mountains. \n\n10000\n\
    9000\n8000\n7000\n6000\n5000\n4000\n3000\n2000\n1000\nAsia  \nEverest \nSouth\
    \ America  \nAconcagua  \nNorth America  \nDenali\nAfrica  \nKilimanjaro \nEurope\
    \  \nElbrus\nAntarctica  \nVinson Massif \nAustralia  \nKoscuiszko\n\nData Handling\
    \ and Presentation\n\nIn general, it is more intuitive, suggestive and visually\
    \ appealing \nto represent heights, that are measured upwards from the ground,\
    \ \nusing bar graphs that have vertical bars or columns. Similarly, \nlengths\
    \ that are parallel to the ground (for example, distances \nbetween location on\
    \ Earth) are usually best represented using bar \ngraphs with horizontal arcs.\
    \ \n Figure it Out\n1.\t\nIf you wanted to visually represent the data of the\
    \ heights of the \ntallest persons in each class in your school, would you use\
    \ a graph \nwith vertical bars or horizontal bars? Why?\n2.\t\n\aIf you were making\
    \ a table of the longest rivers on each continent \nand their lengths, would you\
    \ prefer to use a bar graph with \nvertical bars or with horizontal bars? Why?\
    \ Try finding out this \ninformation, and then make the corresponding table and\
    \ bar \ngraph! Which continents have the longest rivers?\nInfographics\nWhen data\
    \ visualisations such as bar graphs are further beautified \nwith more extensive\
    \ artistic and visual imagery, they are called \ninformation graphics or infographics\
    \ for short.  The aim of \ninfographics is to make use of attention-attracting\
    \ and engaging \nvisuals to communicate information even more clearly and quickly,\
    \ \nin a visually pleasing way. \n\t\nAs an example of how infographics can be\
    \ used to communicate \ndata even more suggestively, let us go back to the table\
    \ above listing \nthe tallest mountain on each continent. We drew a bar graph\
    \ with \nvertical bars (columns) rather than horizontal bars, to be more \nindicative\
    \ of mountains. But instead of rectangles, we could use \ntriangles, which look\
    \ a bit more like mountains. And, we can add a \nsplash of colour as well. Here\
    \ is the result.\n\nGanita Prakash | Grade 6\b\n\n8000m\n7000m\n6000m\n5000m\n\
    4000m\n3000m\n2000m\n1000m\nEverest\n8848m\n Asia\nAconcagua\n6962m\nS America\n\
    Denali\n6194m \nNorth \nAmerica\nKilimanjaro \n5895m\nAfrica\nElbrus\n5642m\n\
    Europe\nVinson Massif\n4892m \nAntarctica\nKoscuiszko\n2228m\nAustralia\n\t\n\
    While this infographic might look more appealing and suggestive at \nfirst glance,\
    \ it does have some issues. The goal of our bar graph earlier \nwas to represent\
    \ the heights of various mountains — using bars of the \nappropriate heights but\
    \ the same widths. The purpose of using the \nsame widths was to make it clear\
    \ that we are only comparing heights. \nHowever, in this infographic, the taller\
    \ triangles are also wider! Are \ntaller mountains always wider? The infographic\
    \ is implying additional \ninformation that may be misleading and may or may not\
    \ be correct. \nSometimes going for more appealing pictures can also accidentally\
    \ \nmislead.\n\t\nTaking this idea further, and to make the picture even more\
    \ visually \nstimulating and suggestive, we can further change the shapes of the\
    \ \nmountains to make them look even more like mountains, and add \nother details,\
    \ while attempting to preserve the heights. For example, \nwe can create an imaginary\
    \ mountain range that contains all these \nmountains.\n\t\nIs the infographic\
    \ below better than the column graph with \nrectangular columns of equal width?\
    \ The mountains look more \nrealistic, but is the picture accurate? \n\t\nFor\
    \ example, Everest appears to be twice as tall as Elbrus.\n\nData Handling and\
    \ Presentation\n\nThe seven highest peaks on \nthe seven continents.\n\t\nWhat\
    \ is 5642 × 2? \n\t\nWhile preparing visually-appealing presentations of data,\
    \ we \nalso need to be careful that the pictures we draw do not mislead us \n\
    about the facts. In general, it is important to be careful when making \nor reading\
    \ infographics, so that we do not mislead our intended \naudiences and we, ourselves,\
    \ are not misled. \nSu m m a r y\n\x1F\n\x1F\nFacts, numbers, measures, observations\
    \ and other descriptions of \nthings that convey information about those things\
    \ is called data.\n\x1F\n\x1F\nData can be organised in a tabular form using tally\
    \ marks for easy \nanalysis and interpretation. \n\x1F\n\x1F\nFrequencies are\
    \ the counts of the occurrences of values, measures or \nobservations.\n\nGanita\
    \ Prakash | Grade 6\b\n\nPictographs represent data in the form of pictures, or\
    \ objects or parts \nof objects. Each picture represents a frequency which can\
    \ be 1 or more \nthan 1 — this is called the scale and it must be specified. \n\
    \x1F\n\x1F\nBar graphs have bars of uniform width; the length or height that \n\
    indicates the total frequency of occurrence. The scale that is used to \nconvert\
    \ length or height to frequency again, must be specified. \n\x1F\n\x1F\nChoosing\
    \ the appropriate scale for a pictograph or bar graph is \nimportant to accurately\
    \ and effectively convey the desired information \nor data and to also make it\
    \ visually appealing.\n\x1F\n\x1F\nOther aspects of a graph also contribute to\
    \ its effectiveness and visual \nappeal such as how colours are used, what accompanying\
    \ pictures \nare drawn, and whether the bars are horizontal or vertical. These\
    \ \naspects correspond to the artistic and aesthetic side of data handling \n\
    and presentation. \n\x1F\n\x1F\nHowever, making visual representations of data\
    \ ‘fancy’ can also \nsometimes be misleading.\n\x1F\n\x1F\nBy reading pictographs\
    \ and bar graphs accurately, we can quickly \nunderstand and make inferences about\
    \ the data presented.\n\nCHAPTER 4 — SOLUTIONS \nData Handling and Presentation\
    \  \nSection 4.1  \nPage No. 75 \nFigure it Out  \nQ.1. What would you do to find\
    \ the most popular game among Naresh’s and Navya’s \nclassmates? \nAns. \nOne\
    \ of the ways could be to arrange and organize the given data in a table. Think\
    \ of \nsome other ways. \nQ.2. What is the most popular game in their class? \n\
    Ans. \nHockey (frequency – 8). \nQ.4. Pari wants to respond to the questio\n\"\
