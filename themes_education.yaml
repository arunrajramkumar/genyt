    \ Simple Estimation\nAt times, we may not know or need an exact count of things\
    \ and \nan estimate is sufficient for the purpose at hand. For example, \nyour\
    \ school headmaster might know the exact number of students \nenrolled in your\
    \ school, but you may only know an estimated \ncount. How many students are in\
    \ your school? About 150? 400? A \nthousand?\nParomita’s class section has 32\
    \ children. The other 2 sections of \nher class have 29 and 35 children. So, she\
    \ estimated the number of \nchildren in her class to be about 100. Along with\
    \ Class 6, her school \nalso has Classes 7–10 and each class has 3 sections each.\
    \ She assumed \na similar number in each class and estimated the number of students\
    \ \nin her school to be around 500.\n Figure it Out\n\t\n\aWe shall do some simple\
    \ estimates. It is a fun exercise, and you may \nfind it amusing to know the various\
    \ numbers around us. Remember, \n\nwe are not interested in the exact numbers\
    \ for the following questions. \nShare your methods of estimation with the class.\n\
    1. \t Steps you would take to walk:\na.\t From the place you are sitting to the\
    \ classroom door\nb.\t Across the school ground from start to end \nc.\t From\
    \ your classroom door to the school gate\nd.\t From your school to your home \n\
    2.\t Number of times you blink your eyes or number of breaths you \ntake:\na.\t\
    \ In a minute \nb.\t In an hour\nc.\t In a day\n3.\t Name some objects around\
    \ you that are:\na.\t a few thousand in number\nb.\t more than ten thousand in\
    \ number\n Estimate the answer\n\t\nTry to guess within 30 seconds. Check your\
    \ guess with your friends.\n1.\t \tNumber of words in your maths textbook:\na.\t\
    \ More than 5000   \nb.\t Less than 5000\n2.\t \t\aNumber of students in your\
    \ school who travel to school by bus: \na.\t More than 200    \nb.\t Less than\
    \ 200\n3.\t \a\tRoshan wants to buy milk and 3 types of fruit to make fruit \n\
    custard  for 5 people. He estimates the cost to be ₹100. Do you \nagree with him?\
    \ Why or why not?\n4.\t \tEstimate the distance between Gandhinagar (in Gujarat)\
    \ to \nKohima (in Nagaland). \n\t\nHint: Look at the map of India to locate these\
    \ cities.\n\nNumber Play\n\n5.\t \a\tSheetal is in Grade 6 and says she has spent\
    \ around 13,000 hours \nin school till date. Do you agree with her? Why or why\
    \ not?\n6.\t \t\aEarlier, people used to walk long distances as they had no other\
    \ \nmeans of transport. Suppose you walk at your normal pace. \nApproximately,\
    \ how long would it take you to go from: \na.\t Your current location to one of\
    \ your favourite places nearby. \nb.\t Your current location to any neighbouring\
    \ state’s capital city. \nc.\t The southernmost point in India to the northernmost\
    \ point in \nIndia.\n7.\t Make some estimation questions and challenge your classmates!\n\
    \n3.12 Games and Winning Strategies\nNumbers can also be used to play games and\
    \ develop winning \nstrategies.\nHere is a famous game called 21. Play it with\
    \ a classmate. Then \ntry it at home with your family!\n Rules for Game #1: The\
    \ first player says 1, 2 or 3. Then the two \nplayers take turns adding 1, 2,\
    \ or 3 to the previous number said. The \nfirst player to reach 21 wins!\nPlay\
    \ this game several times with your classmate.  Are you starting \nto see the\
    \ winning strategy? \nWhich player can always win if they play correctly? What\
    \ is the \npattern of numbers that the winning player should say?\nThere are many\
    \ variations of this game. Here is another common \nvariation:\n Rules for Game\
    \ #2: The first player says a number between 1 and \n10. Then the two players\
    \ take turns adding a number between 1 and \n10 to the previous number said. The\
    \ first player to reach 99 wins!\nPlay this game several times with your classmate.\
    \ See if you can \nfigure out the corresponding winning strategy in this case!\
    \ Which \n\nplayer can always win? What is the pattern of numbers that the \n\
    winning player should say this time?\nMake your own variations of this game —\
    \ decide how much one \ncan add at each turn, and what number is the winning number.\
    \ Then \nplay your game several times, and figure out the winning strategy \n\
    and which player can always win!\n Figure it Out\b\n1.\t There is only one supercell\
    \ \n(number greater than all its \nneighbours) in this grid. If you \nexchange\
    \ two digits of one of \nthe numbers, there will be 4 \nsupercells. Figure out\
    \ which \ndigits to swap.\n2.\t How many rounds does your year of birth take to\
    \ reach the \nKaprekar constant?\n3.\t We are the group of 5-digit numbers between\
    \ 35,000 and 75,000 \nsuch that all of our digits are odd. Who is the largest\
    \ number in our \ngroup? Who is the smallest number in our group? Who among us\
    \ \nis the closest to 50,000? \n4.\t Estimate the number of holidays you get in\
    \ a year including \nweekends, festivals and vacation. Then, try to get an exact\
    \ number \nand see how close your estimate is. \n5.\t Estimate the number of liters\
    \ a mug, a bucket and an overhead \ntank can hold. \n6.\t Write one 5-digit number\
    \ and two 3-digit numbers such that their \nsum is 18,670. \n7.\t Choose a number\
    \ between 210 and 390. Create a number pattern \nsimilar to those shown in Section\
    \ 3.9 that will sum up to this number.\n16,200\n39,344\n29,765\n45,306\n23,609\n\
    19,381\n50,319\n38,408\n62,871\nTry\nThis\n\nNumber Play\n\n  8.\tRecall the sequence\
    \ of Powers of 2 from Chapter 1, Table 1. Why is \nthe Collatz conjecture correct\
    \ for all the starting numbers in this \nsequence?\n  9.\tCheck if the Collatz\
    \ Conjecture holds for the starting number 100.  \n10.\tStarting with 0, players\
    \ alternate adding numbers between 1 and 3. \nThe first person to reach 22 wins.\
    \ What is the winning strategy now?\nSu m m a r y\n\x1F\n\x1F\nNumbers can be\
    \ used for many different purposes including, to convey \ninformation, make and\
    \ discover patterns, estimate magnitudes, pose \nand solve puzzles, and play and\
    \ win games. \n\x1F\n\x1F\nThinking about and formulating set procedures to use\
    \ numbers for \nthese purposes is a useful skill and capacity (called ‘computational\
    \ \nthinking’).\n\x1F\n\x1F\nMany problems about numbers can be very easy to pose,\
    \ but very \ndifficult to solve.  Indeed, numerous such problems are still unsolved\
    \ \n(for example, Collatz’s Conjecture).\n\n[1] \n \nCHAPTER 3 — SOLUTIONS \n\
    Number Play \n \nQ. Think about various situations where we use numbers. List\
    \ five different situations in \nwhich numbers are used. See what your classmates\
    \ have listed, share, and discuss. \nAns. \nFive different possible situations\
    \ in which numbers are used - \n1. \nTime  \n2. \nCalendar \n3. \nCounting objects/Marks\
    \ \n4. \nMeasurement of height & weight  \n5. \nMoney  \nThere could many more.\
    \ \n \nSection 3.1  \nPage No. 55  \nQ. What do you think these numbers mean?\
    \ \nAns. \nRefer page 56. \n  Page No. 56 \nQ1. Can the children rearrange themselves\
    \ so that the children standing at the ends say \n‘2’? \nAns. No; There will be\
    \ no one standing on the other side of the child standing at the end.  \nQ2. Can\
    \ we arrange the children in a line so that all would say only 0s? \nAns. Yes;\
    \ All the children in the line should be of same height.  \nQ3. Can two children\
    \ standing next to each other say the same number? \nAns. Yes; Refer picture on\
