    \ 4\n7 > 1\n2.\nNow I understood why you multiplied \nthe numerator and denominator\
    \ by 4.\nWhen the number of \nchildren is same, it is easier \nto compare, isn’t\
    \ it? \n\nFractions\n\nShabnam: \aThere is a condition. The fractional unit used\
    \ for the two \nfractions have to be the same! Like 2\n6 and 3\n6 both use the\
