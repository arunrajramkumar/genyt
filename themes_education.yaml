    \ student would relate to.\n\nTextbook excerpt:\n\"\"\"\n2.5 Angle\nAn angle is\
    \ formed by two rays having a \ncommon starting point. Here is an angle \nformed\
    \ by rays BD  and BE  where B is \nthe common starting point (Fig. 2.8).\nThe\
    \ point B is called the vertex of the \nangle, and the rays BD  and BE  are called\
    \ \nthe arms of the angle. How can we name \nthis angle? We can simply use the\
    \ vertex and say that it is the Angle B. \nTo be clearer, we use a point on each\
    \ of the arms together with the \nvertex to name the angle. In this case, we name\
    \ the angle as Angle DBE \nor Angle EBD. The word angle can be replaced by the\
    \ symbol ‘∠’, i.e., \n∠DBE or ∠EBD. Note that in specifying the angle, the vertex\
    \ is always \nwritten as the middle letter.\nTo indicate an angle, we use a small\
    \ curve at the vertex (refer \nto Fig. 2.9).\nVidya has just opened her book.\
    \ Let us observe her opening the \ncover of the book in different scenarios.\n\
    Case 1\t\nCase 2\t\nCase 3\t\nCase 4\t\nCase 5\t\nCase 6\nO\nB\nA\nFig. 2.7\n\
    Fig. 2.8\nB\nD\nE\nvertex\narm\narm\n\n  Do you see angles being made in each\
    \ of these cases? Can you mark \ntheir arms and vertex?\nWhich angle is greater—the\
    \ angle in Case 1 or the angle in Case 2? \nJust as we talk about the size of\
    \ a line based on its length, we also \ntalk about the size of an angle based\
    \ on its amount of rotation. \nSo, the angle in Case 2 is greater as in this case\
    \ she needs to rotate \nthe cover more. Similarly, the angle in Case 3 is even\
    \ larger than that \nof Case 2, because there is even more rotation, and Cases\
    \ 4, 5, and 6 \nare successively larger angles with more and more rotation.\n\
    The size of an angle is the amount of rotation or turn that is needed \nabout\
    \ the vertex to move the first ray to the second ray. \nFig. 2.9\nFinal position\
    \ of ray\nAmount of turn is the size of \nthe angle\nVertex\nInitial position\
    \ of ray\nLet’s look at some other examples where angles arise in real life \n\
    by rotation or turn:\b\n•\t In a compass or divider, we turn the arms to form\
    \ \nan angle. The vertex is the point where the two \narms are joined. Identify\
    \ the arms and vertex of \nthe angle.  \n•\t A pair of scissors has two blades.\
    \ When we open \nthem (or ‘turn them’) to cut something, the blades \nform an\
    \ angle. Identify the arms and the vertex of \nthe angle. \n\nLines and Angles\n\
    \n•\t Look at the pictures of spectacles, wallet and other common \nobjects. Identify\
    \ the angles in them by marking out their arms \nand vertices.\nDo you see how\
    \ these angles are formed by turning one arm with \nrespect to the other?\nTeacher\
    \ needs to organise various activities with the students to \nrecognise the size\
    \ of an angle as a measure of rotation. \nTeacher’s Note\n\t Figure it Out\n1.\t\
    \ \aCan you find the angles in the given pictures? Draw the rays \nforming any\
    \ one of the angles and name the vertex of the angle.\nA\nB\nC\nD\n\n2.\t Draw\
    \ and label an angle with arms ST and SR. \n3.\t Explain why ∠APB cannot be labelled\
    \ as ∠P.\nA\nP\nB\nC\n4. Name the angles marked in the given figure.\nP\nT\nR\n\
    Q\n5. \nMark any three points on your paper that are not on one line. Label \n\
    them A, B, C. Draw all possible lines going through pairs of these \npoints. How\
    \ many lines do you get? Name them. How many angles \ncan you name using A, B,\
    \ C? Write them down, and mark each of \nthem with a curve as in Fig. 2.9.\nMath\
    \ \nTalk\n\nLines and Angles\n\n6.\t\nNow mark any four points on your paper so\
    \ that no three of them \nare on one line. Label them A, B, C, D. Draw all possible\
    \ lines going \nthrough pairs of these points. How many lines do you get?  Name\
    \ \nthem. How many angles can you name using A, B, C, D? Write them \nall down,\
    \ and mark each of them with a curve as in Fig. 2.9.\n\n2.6 Comparing Angles\n\
    Look at these animals opening their mouths. Do you see any angles \nhere? If yes,\
    \ mark the arms and vertex of each one. Some mouths are \nopen wider than others;\
    \ the more the turning of the jaws, the larger \nthe angle! Can you arrange the\
    \ angles in this picture from smallest to \nlargest?\n  Is it always easy to compare\
    \ two angles?\nHere are some angles. Label each of the angles. How will you \n\
    compare them?\nDraw a few more angles; label them and compare.\nMath \nTalk\n\n\
    Comparing angles by superimposition\nAny two angles can be compared by placing\
    \ them one over the other, \ni.e., by superimposition. While superimposing, the\
    \ vertices of the \nangles must overlap.\nAfter superimposition, it becomes clear\
    \ which angle is smaller \nand which is larger. \nB\nA\nC\nQ\nP\nR\nQ (B)\nP\n\
    A\nC\nR\nThe picture shows the two angles superimposed. It is now clear \nthat\
    \ ∠PQR is larger than ∠ABC.\nEqual angles. Now consider ∠AOB and ∠XOY in the figure.\
    \ Which \nis greater? \nY\nO\nX\nO\nB\nY\nX\nA\nO\nB\nA\nThe corners of both of\
    \ these angles match and the arms overlap with \neach other, i.e., OA ↔ OX and\
    \ OB ↔ OY. So, the angles are equal in size.\nThe reason these angles are considered\
    \ to be equal in size is \nbecause when we visualise each of these angles as being\
    \ formed out \nof rotation, we can see that there is an equal amount of rotation\
    \ \nneeded to move  OB to OA  and OY  to OX.\nFrom the point of view of superimposition,\
    \ when two angles \nare superimposed, and the common vertex and the two rays of\
    \ \nboth angles lie on top of each other, then the sizes of the angles \nare equal.\
    \  \n\nLines and Angles\n\n Where else do we use superimposition to compare?\n\
