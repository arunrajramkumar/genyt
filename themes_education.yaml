- theme: "Explain these Grade 6 CBSE Maths (NCERT Ganita Prakash) concepts from Chapter\
    \ 10 \"The Other Side of Zero\": Bela’s Building of Fun & The Token Model.\n\n\
    Use ONLY the mathematical facts, definitions, and rules described in the textbook\
    \ excerpt below -- do not introduce incorrect or additional mathematical claims.\
    \ Make it very easy to understand for an 11-12 year old: explain each idea simply,\
    \ step by step, and illustrate every concept with your own original real-life\
    \ example a school student would relate to.\n\nTextbook excerpt:\n\"\"\"\n10.1\
    \ Bela’s Building of Fun\nChildren flock to Bela’s ice cream factory to see \n\
    and taste her tasty ice cream. To make it even \nmore fun for them, Bela purchased\
    \ a multi-\nstoried building and filled it with attractions. \nShe named it Bela’s\
    \ Building of Fun. \nBut this was no ordinary building! \nObserve that some of\
    \ the floors in the \n‘Building of Fun’ are below the ground. What are the shops\
    \ that you \nfind on these floors? What is there on the ground floor?\nA lift\
    \ is used to go up and down between the floors. It has two \nbuttons: ‘+’ to go\
    \ up and ‘–’ to go down. Can you spot the lift?\nTo go to the Art Centre from\
    \ the ‘Welcome Hall’, you \nmust press the ‘+’ button twice. \nWe say that the\
    \ button press is + + or + 2.\nTo go down two floors, you must press the ‘–’ \n\
    button twice, which we write as – – or – 2.\nSo if you press + 1 (i.e., if you\
    \ press the ‘+’ \nbutton once), then you will go up one floor and if \nyou press\
    \ – 1 (i.e., if you press the ‘–’ button \nonce), then you will go down 1 floor.\n\
    Lift button presses and numbers:\n+++ is written as + 3\n – – – – is written as\
    \ –  4\n What do you press to go four floors up? \nWhat do you press to go three\
    \ floors down?\n\nNumbering the floors in the building of fun\nEntry to the ‘Building\
    \ of Fun’ is at the ground floor level and is called \nthe ‘Welcome Hall’. Starting\
    \ from the ground floor, you can reach the \nFood Court by pressing + 1 and can\
    \ reach the Art Centre by pressing \n+ 2. So, we can say that the Food Court is\
    \ on Floor + 1 and that the Art \nCentre is on Floor + 2.\nStarting from the ground\
    \ floor, you must press – 1 to reach the Toy \nStore. So, the Toy Store is on\
    \ Floor – 1 similarly starting from the ground \nfloor, you must press – 2 to\
    \ reach the Video Games shop. So, the Video \nGames shop is on Floor – 2.\nThe\
    \ ground floor is called Floor 0. Can you see why?\n  Number all the floors in\
    \ the Building of Fun.\nDid you notice that + 3 is the floor number of the Book\
    \ \nStore, but it is also the number of floors you move \nwhen you press + 3?\
    \ Similarly,  – 3 is the floor number \nbut it is also the number of floors you\
    \ go down when \nyou press – 3, i.e., when you press – – – .\nA number with a\
    \ ‘+’ sign in front is called a positive \nnumber. A number with a ‘–’ sign in\
    \ front is called a \nnegative number. \nIn the ‘Building of Fun’, the floors\
    \ are numbered \nusing the ground floor, Floor 0, as a reference or starting \n\
    point. The floors above the ground floor are numbered \nwith positive numbers.\
    \ To get to them from the ground \nfloor, one must press the ‘+’ button some number\
    \ of \ntimes. The floors below the ground are numbered with \nnegative numbers.\
    \ To get to them from the ground floor, \none must press the ‘–’ button some number\
    \ of times.\nZero is neither a positive nor a negative number. \nWe do not put\
    \ a ‘+’ or ‘–’ sign in front of it.\n\nThe Other Side of Zero\n\nAddition to keep\
    \ track of movement\nStart from the Food Court and press + 2 in the lift. Where\
    \ will you \nreach? ____________\nWe can describe this using an expression:\n\
    Starting Floor + Movement = Target Floor.\nThe starting floor is + 1 (Food Court)\
    \ and the number of button \npresses is + 2. Therefore,  you reach the target\
    \ floor (+ 1) + (+ 2) = + 3 \n(Book Store).\n Figure it Out\n1.\t \aYou start\
    \ from Floor + 2 and press – 3 in the lift. Where will you \nreach? Write an expression\
    \ for this movement.\n2.\t Evaluate these expressions (you may think of them as\
    \ Starting \nFloor + Movement by referring to the Building of Fun).\na.\t (+ 1) + (+ 4)\
    \ = _______\t\nb.\t (+ 4) + (+ 1) = _______\nc.\t (+ 4) + (–  3) = _______\t\n\
    d.\t (– 1) + (+ 2) = _______\ne.\t (– 1) + (+ 1) = _______\t\nf.\t      0 + (+ 2)\
    \ = _________\ng.\t      0 + (– 2) = _________\n3.\t\n\aStarting from different\
    \ floors, find the movements required to \nreach Floor – 5. For example, if I\
    \ start at Floor + 2, I must press – 7 \nto reach Floor – 5. The expression is\
    \ (+ 2) + (– 7) = – 5.\n\t\n\aFind more such starting positions and the movements\
    \ needed to \nreach Floor – 5 and write the expressions.\nCombining button presses\
    \ is also addition \nGurmit was in the Toy Store and wanted to go down two floors.\
    \ \nBut by mistake he pressed the ‘+’ button two times. He realised his \nmistake\
    \ and quickly pressed the ‘–’ button three times. How many \nfloors below or above\
    \ the Toy Store will Gurmit reach?\nGurmit will go one floor down. We can show\
    \ the movement \nresulting from combining button presses as an expression: \n\
    (+ 2) + (– 3) = – 1.\n\n \aFigure it out\nEvaluate these expressions by thinking\
    \ of them as the resulting movement \nof combining button presses:\na. \t (+ 1) + (+ 4)\
    \ = _____________\t\nb.\t (+ 4) + (+ 1) = _____________\nc.\t (+ 4) + (–  3) + (– 2)\
    \ = _______\t\nd.\t (– 1) + (+ 2) + (– 3)  = _______\nBack to zero!\nOn the ground\
    \ floor, Basant is in a great hurry and by \nmistake he presses +3. What can he\
    \ do to cancel it and \nstay on the ground floor? He can cancel it by pressing\
    \ \n– 3. That is, (+3) + (– 3) = 0.\nWe call – 3 the inverse of +3. Similarly,\
    \ the inverse of \n– 3 is +3.\nIf Basant now presses +4 and then presses – 4 in\
    \ the \nlift, where will he reach?\nHere is another way to think of the concept\
    \ of \ninverse. If you are at Floor +4 and you press its inverse \n– 4, then you\
    \ are back to zero, the ground floor! If you \nare at Floor – 2 and press its\
    \ inverse +2, then you go to \n(– 2) + (+2) = 0, again the ground floor!\n  \a\
    Write the inverses of these numbers: \t\n\t\n\t\n\t\n+4, –4, –3, 0, +2, –1.\n\
      \aConnect the inverses by drawing lines.\n+9\n+7\n–8\n–5\n–7\n+8\n+5\n–9\nComparing\
    \ numbers using floors\n Who is on the lowest floor? \n1.\t Jay is in the Art\
    \ Centre. So, he is on Floor +2. \n2.\t Asin is in the Sports Centre. So, she\
    \ is on Floor ___.\n3.\t Binnu is in the Cinema Centre. So, she is on Floor ____.\
    \ \n4.\t Aman is in the Toys Store. So, he is on Floor ____.\n\nThe Other Side\
    \ of Zero\n\nFloor +3 is lower than Floor +4. So, we write +3 < +4. We \nalso\
    \ write +4 > +3. \n  Should we write –3 < – 4 or – 4 < – 3? \nFloor – 4 is lower\
    \ than Floor – 3. So, – 4 < – 3. It is also \ncorrect to write – 3 > – 4\n \a\
    Figure it Out\n1. \t Compare the following numbers using the Building of \nFun\
    \ and fill in the boxes with < or >.\na.\t – 2 \n +5\t\nb.\t – 5 \n + 4\t\nc.\t\
    \ – 5 \n – 3\nd.\t + 6 \n – 6\t\ne.\t 0 \n – 4\t\nf.\t 0 \n + 4\nNotice that all\
    \ negative number floors are below \nFloor 0. So, all negative numbers are less\
    \ than 0. All \nthe positive number floors are above Floor 0. So, all \npositive\
    \ numbers are greater than 0.\n2. \t Imagine the Building of Fun with more floors.\
    \ Compare \nthe numbers and fill in the boxes with < or >:\na.\t – 10 \t\n\t – 12\t\
    \nb.\t + 17 \t\n\t – 10\nc.\t     0 \t\n\t – 20\t\nd.\t  + 9\t\n \t– 9\ne.\t – 25\t\
    \n\t – 7\t\nf.\t + 15\t\n \t– 17\n3. \t If Floor A = – 12, Floor D = – 1 and Floor\
    \ E = + 1 in the \nbuilding shown on the right as a line, find the numbers \n\
    of Floors B, C, F, G, and H.\n4.\t Mark the following floors of the building shown\
    \ on \nthe right.\na.\t – 7\t\nb.\t –  4\t\nc.\t + 3\t\nd.\t –  10\nSubtraction\
    \ to find which button to press\nIn earlier classes, we understood the meaning\
    \ of subtraction as ‘take \naway’. For example, there are 10 books on the shelf.\
    \ I take away 4 \nbooks. How many are left on the shelf?\nWe can express the answer\
    \ using subtraction: 10 – 4 = 6 or ‘Ten \ntake away four is six.’\n\n+1\nE\nF\n\
    G\nH\nD\nC\nB\nA\n–1\n–12\n\nYou may also be familiar with another meaning of\
    \ subtraction which \nis related to comparison or making quantities equal. For\
    \ example, \nconsider this situation: I have `10 with me and my sister has `6.\n\
    Now, I can ask the question: ʻHow much more money should my \nsister get in order\
    \ to have the same amount as me?ʼ\nWe can write this in two ways: 6 + ? = 10 \
    \  Or   10 – 6 = ?\nHere, we see the connection between ‘finding the missing number\
    \ \nto be added’ and subtraction.\nFor subtraction of positive and negative numbers,\
    \ we will use \nthis meaning of subtraction as ‘making equal’ or ‘finding the\
    \ missing \nnumber to be added’.\n  \aEvaluate 15 – 5, 100 – 10 and 74 – 34 from\
    \ this perspective. \nIn general, when there are two unequal quantities, subtraction\
    \ can \nindicate the change needed to make the quantities equal. Subtraction \n\
