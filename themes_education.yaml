    \"\"\n7.1 Fractional Units and Equal Shares\nBeni:\t\nWhich fraction is greater —\
    \ 1\n5 or 1\n9?\nArvin:\t\n9 is bigger than 5. So I would guess that 1\n9  is\
    \ greater \nthan 1\n5. Am I right?\nBeni:\t\nNo! That is a common mistake. Think\
    \ of these fractions \nas shares.\nArvin:\t\nIf one roti is shared among 5 children,\
    \ each one gets a \nshare of 1\n5  roti. If one roti is shared among 9 children,\
    \ \neach one gets a share of 1\n9  roti?\nBeni:\t\nExactly! Now think again -\
    \ which share is higher?\nArvin:\t\nIf I share with more people, I will get less.\
    \ So, 1\n9 < 1\n5.\nBeni:\t\nYou got it!\nOh, so \n\n100  is bigger than 1\n200!\n\
    When one unit is divided into several equal parts, each part is \ncalled a fractional\
    \ unit. These are all fractional units: \n\n2 , 1\n3 , 1\n4 , 1\n5 , 1\n6 , …,\
    \ 1\n10 , …, 1\n50 , …, 1\n100, etc.\nWe also sometimes refer to fractional units\
    \ as ‘unit fractions.’\n Figure it Out\b\n\t\nFill in the blanks with fractions.\n\
    1.\t \aThree guavas together weigh 1 kg. If they are roughly of the same \nsize,\
    \ each guava will roughly weigh ____ kg.\n2.\t \aA wholesale merchant packed 1\
    \ kg of rice in four packets \nof equal weight. The weight of each packet is ___\
    \ kg.\n3.\t \aFour friends ordered 3 glasses of sugarcane juice and \nshared it\
    \ equally among themselves. Each one drank ____ \nglass of sugarcane juice.\n\n\
    2  > 1\n\nMath \nTalk\n\nFractions\n\n4.\t \x03The big fish weighs 1\n2  kg. The\
    \ small one weighs 1\n4  kg. \nTogether they weigh ____ kg.\nKnowledge from the\
    \ past!\nFractions have been used and named in India since ancient times. \nIn\
    \ the Rig Veda, the fraction 3\n4  is referred to as tri-pada. This has the \n\
    same meaning as the words for 3\n4  in many Indian languages today, \ne.g., ʻteen\
    \ paavʼ in colloquial Hindi and ‘mukkaal’ in Tamil. Indeed, \nwords for fractions\
    \ used today in many Indian languages go back to \nancient times. \n\aFind out\
    \ and discuss the words for fractions that are used in the different \nlanguages\
    \ spoken in your home, city, or state. Ask your grandparents, \nparents, teachers,\
    \ and classmates what words they use for different \nfractions, such as for one\
