    \ Out \nQ.1.   \n     \n \nCan you help Rihan and Sheetal find their answers?\
    \ \nAns. \nRihan can draw many/uncountable number of lines through the given point.\
    \  \nSheetal can draw only one line through the two given points. \nQ.2. Name\
    \ the line segments in Fig. 2.4. Which of the five marked points are on exactly\
    \ \none of the line segments? Which are on two of the line segments? \nAns. \n\
    LM, MP, PQ, QR  \nPoints L and R are exactly on one line segment. Points M, P\
    \ and Q are on two line \nsegments. \nQ.3. Name the rays shown in Fig. 2.5. Is\
    \ T the starting point of each of these rays? \nAns. \n TA, TB, TN and NB   \n\
    \ \nNo, T is the starting point of TB, TN and TA but not of NB. \nQ.4. Draw a\
    \ rough figure and write labels appropriately to illustrate each of the \nfollowing:\
    \ \na. OP and OQ meet at O. \nb. XY and PQ intersect at point M. \nc. Line l contains\
    \ points E and F but not point D. \nd. Point P lies on AB. \n \nAns. \n \nRihan\
    \ marked a point on a piece of \npaper. How many lines can he draw \nthat pass\
    \ through the point? \nSheetal marked two points on a piece \nof paper. How many\
    \ different lines \ncan she draw that pass through \nboth of the points? \n\n\
    [2] \n \n \nQ.5. In Fig. 2.6, name: \na. Five points  \nb. A line \nc. Four rays\
    \ \nd. Five line segments \nAns. \n \na) D, E, O, B and C \n \nb) DE or DO or\
    \ DB or EO or EB or OB \n \nc) OC,   OB,  OE,   OD  (Try for other rays)  \n \n\
    d) DE, DO, DB, EO, EB (OB; OC are also possible)  \n \nQ.6. Here is a ray OA (Fig.\
    \ 2.7). It starts at O and passes through the point A. It also \npasses \nthrough\
    \ the point B. \na. Can you also name it as OB? Why? \nb. Can we write OA as AO?\
    \ Why or why not? \nAns. \na) Yes, O is the starting point and point B lies on\
    \ the rays that goes endlessly in the  \ndirection of A. OA is the extension of\
    \ OB. \nb) No, OA is a ray with starting point O whereas AO is a ray with starting\
    \ point A. \n\n[3] \n \nSection 2.5  \nPage – 19 \nFigure it Out  \nQ.1. Can you\
    \ find the angles in the given pictures? Draw the rays forming any one of the\
    \ \nangles and name the vertex of the angle.  \nAns.  Yes, one of the angles is\
    \ ∠BDC. It’s vertex is D. One ray is DC and the other rays DB. \nTry for other\
    \ pictures. \nQ.2. Draw and label an angle with arms ST and SR. \n \nAns. \n \
    \ \nQ.4. Name the angles marked in the given figure. \nAns. \n∠RTQ, ∠RTP \n \n\
    Q.5. Mark any three points on your paper that are not on one line. Label them\
    \ A, B, C. \nDraw all possible lines going through pairs of these points. How\
    \ many lines do you \nget? Name them. How many angles can you name using A, B,\
    \ C? Write them down, \nand mark each of them with a curve as in Fig. 2.9. \n\
    Ans. \nWe get three lines AB, BC, CA.  \n \nUsing A, B & C we can name three angles:\
    \ ∠ABC or ∠CBA, ∠BCA or ∠ACB & ∠CAB \nor ∠BAC.  \n\n[4] \n \nQ.6. Now mark any\
    \ four points on your paper so that no three of them are on one line. Label them\
    \ \nA, B, C, D. Draw all possible lines going through pairs of these points. How\
    \ many lines do \nyou get? Name them. How many angles can you name using A, B,\
    \ C, D? Write them all \ndown, and mark each of them with a curve as in Fig. 2.9.\
    \ \n \nAns. \nWe get six lines AB, BC, CD, DA, AC & BD \n \nUsing A, B, C & D\
    \ we can name the following angles ∠BAC, ∠CAD, ∠BAD, ∠ADB, \n∠BDC, ∠ADC, ∠DCA,\
    \ ∠ACB, ∠DCB, ∠CBD, ∠DBA & ∠CBA  \n \nSection 2.6  \nPage 20  \n  Is it always\
    \ easy to compare two angles? \nNo. it is not always easy to compare two angles.\
    \ For eg. 89º & 91º angles cannot be \ncompared without measuring or overlapping.\
    \ But for the given figures, comparison is easy. \nPage 23 \n  Where else do we\
    \ use superimposition to compare? \nA few examples are- line segments, squares\
    \ and circles. Think of more.  \n  Figure it out  \n \nQ.1. Fold a rectangular\
    \ sheet of paper, then draw a line along the fold created. Name and \ncompare\
