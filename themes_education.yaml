    \ friends on how \nyou decided which one is greater.\n3.\t Which angle is greater:\
    \ ∠XOY or ∠AOB?  Give reasons.\nX\nO\nB\nA\nY\nComparing angles without superimposition\n\
    Two \ncranes \nare \narguing \nabout who can open their \nmouth wider, i.e., who\
    \ is \nmaking a bigger angle. \nLet us first draw their \nangles. How do we know\
    \ \nwhich one is bigger? As seen \nMath \nTalk\nA\nO\nB\nC\nX\nY\nMath \nTalk\n\
    Fig. 2.10\n\nbefore, one could trace these angles, superimpose them and then \n\
    check. But can we do it without superimposition?\nSuppose we have a transparent\
    \ circle which can be moved and \nplaced on figures. Can we use this for comparison?\
    \ \nLet us place the circular paper on the angle made by the first \ncrane. The\
    \ circle is placed in such a way that its centre is on the \nvertex of the angle.\
    \ Let us mark the points A and B on the edge circle \nat the points where the\
    \ arms of the angle pass through the circle.\nO\nO\nB\nB\nA\nA\nCan we use this\
    \ to find out if this angle is greater than, or equal to \nor smaller than the\
    \ angle made by the second crane? \nLet us place it on the angle made by the second\
    \ crane so that the \nvertex coincides with the centre of the circle and one of\
    \ the arms \npasses through OA. \nB\nY\nA\nO\nX\nCan you now tell \nwhich angle\
    \ is bigger?\n\nLines and Angles\n\nWhich crane was making the bigger angle?\n\
    If you can make a circular piece of transparent paper, try this method \nto compare\
    \ the angles in Fig. 2.10 with each other.\n     Teacher’s Note\nA teacher needs\
    \ to check the understanding of the students around \nthe notion of an angle.\
    \ Sometimes students might think that \nincreasing the length of the arms of the\
    \ angle increases the angle. \nFor this, various situations should be posed to\
    \ the students to check \ntheir understanding on the same.\n\"\"\""
