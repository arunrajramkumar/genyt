    \ Bar Graphs\nHave \nyou \nseen \ngraphs \nlike this on TV or in a \nnewspaper?\n\
    \t\nLike pictographs, such \nbar graphs can help us to \nquickly understand and\
    \ \ninterpret \ninformation, \nsuch as the highest value, \nthe comparison of\
    \ values \nof different categories, etc. \nHowever, when the amount \nof data\
    \ is large, presenting \nit by a pictograph is not \nonly time consuming but \n\
    at times difficult too. Let us \nsee how data can be presented instead using a\
    \ bar graph. \n\t\nLet’s take the data collected by Lakhanpal earlier, regarding\
    \ the \nnumber of students absent on one day in each class:\nClass\nI\nII\nIII\n\
    IV\nV\nVI\nVII\nVIII\nNo. of \nstudents\n\nSource: https://www.statista.com/chart/17122/\n\
    number-of-threatened-species-red-list/\n\nGanita Prakash | Grade 6\b\n\nHe presented\
    \ the same data using a bar graph:\n\t\n1 unit length = 1 student\nNumber of students\n\
    Class\nNo. of students absent in each class\n\nIf the students have not noticed,\
    \ please point out the equally spaced \nhorizontal lines. Explain that this means\
    \ that each pair of consecutive \nnumbers on the left has the same gap. \nTeacher’s\
    \ Note \n Answer the following questions using the bar graph:\n1.\t\nIn Class\
    \ 2, ___________ students were absent that day.\n2.\t\n\aIn which class were the\
    \ maximum number of students absent? \n___________\n3.\t\nWhich class had full\
    \ attendance that day? ___________\n\t\nWhen making bar graphs, bars of uniform\
    \ width can be drawn \nhorizontally or vertically with equal spacing between them;\
    \ then the \n\nData Handling and Presentation\n\nlength or height of each bar\
    \ represents the given number. As we saw in \npictographs, we can use a scale\
    \ or key when the frequencies are larger. \n\t\nLet us look at an example of vehicular\
    \ traffic at a busy road crossing \nin Delhi, which was studied by the traffic\
    \ police on a particular day. \nThe number of vehicles passing through the crossing\
    \ each hour from \n6 a.m. to 12:00 noon is shown in the bar graph. One unit of\
    \ length \nstands for 100 vehicles.\n\n1100\n\n1000\n1200\nTime intervals\nNumber\
    \ of vehicles\n11–12\n10–11\n9–10\n8–9\n7–8\n6–7\n\t\nWe can see that the maximum\
    \ traffic at the crossing is shown \nby the longest bar, i.e., for the time interval\
    \ 7–8 a.m. The bar graph \nshows that 1200 vehicles passed through the crossing\
    \ at that time. \nThe second longest bar is for 8–9 a.m. During that time, 1000\
    \ vehicles \npassed through the crossing. Similarly, the minimum traffic is shown\
    \ \nby the smallest bar, i.e., the bar for the time interval 6–7 a.m. During \n\
    that time, only about 150 vehicles passed through the crossing. The \nsecond smallest\
    \ bar is that for the time interval 11 a.m.–12 noon, \nwhen about 600 vehicles\
    \ passed through the crossing.\n\t\nThe total number of cars passing through the\
    \ crossing during the \ntwo-hour interval 8.00–10.00 a.m. as shown by the bar\
    \ graph is about \n1000 + 800 = 1800 vehicles.\n\nGanita Prakash | Grade 6\b\n\
    \n Figure it Out\n1.\t \aHow many total cars passed through the crossing between\
    \ 6 a.m. \nand noon?\b\n2.\t \aWhy do you think so little traffic occurred during\
    \ the hour of \n6–7 a.m., as compared to the other hours from 7 a.m.–noon?\n3.\t\
    \ \aWhy do you think the traffic was the heaviest between 7–8 a.m.?\n4.\t Why\
    \ do you think the traffic was lesser and lesser each hour after \n8 a.m. all\
    \ the way until noon?\nExample:\nYears\nPopulation of India in crores\n\n1951\n\
    1961\n1971\n1981\n1991\n2001\n\nPopulation of India in crores\nThis bar graph\
    \ shows the population of India in each decade over a \nperiod of 50 years. The\
    \ numbers are expressed in crores. If you were \nto take 1 unit length to represent\
