    \ example a school student would relate to.\n\nTextbook excerpt:\n\"\"\"\n5.3\
    \ Co-prime numbers for safekeeping treasures\nWhich pairs are safe?\nLet us go\
    \ back to the treasure finding game. This time, treasures are \nkept on two numbers.\
    \ Jumpy gets the treasures only if he is able to \nreach both the numbers with\
    \ the same jump size. There is also a \nnew rule — a jump size of 1 is not allowed.\n\
    \t Where should Grumpy place the treasures so that Jumpy cannot \nreach both the\
    \ treasures?\nWill placing the treasure on 12 and 26 work? No! If the jump size\
    \ \nis chosen to be 2, then Jumpy will reach both 12 and 26.\nWhat about 4 and\
    \ 9? Jumpy cannot reach both using any jump size \nother than 1. So, Grumpy knows\
    \ that the pair 4 and 9 is safe.\nCheck if these pairs are safe:\na. 15 and 39\
    \ \t\nb. 4 and 15 \nc. 18 and 29 \t\nd. 20 and 55\n\nWhat is special about safe\
    \ pairs? They don’t have any common \nfactor other than 1. Two numbers are said\
    \ to be co-prime to each \nother if they have no common factor other than 1.\n\
    Example: As 15 and 39 have 3 as a common factor, they are not \nco-prime. But\
    \ 4 and 9 are co-prime.\n Which of the following pairs of numbers are co-prime?\n\
    a. 18 and 35\t\nb. 15 and 37 \t\nc. 30 and 415\nd. 17 and 69\t\ne. 81 and 18\n\
     \tWhile playing the ‘idli-vada’ game with different number \npairs, Anshu observed\
    \ something interesting!\n1. \t Sometimes the first common multiple was the same\
    \ \nas the product of the two numbers.\n2. \t At other times the first common\
    \ multiple was less \nthan the product of the two numbers.\n\aFind examples for\
    \ each of the above. How is it related to the \nnumber pair being co-prime?\n\
    Co-prime art\n Observe the following thread art. The first diagram has 12 \npegs\
    \ and the thread is tied to every fourth peg (we say that \nthe thread-gap is\
    \ 4). The second diagram has 13 pegs and the \nthread-gap is 3. What about the\
    \ other diagrams? Observe these \npictures, share and discuss your findings in\
    \ class.\n\n24 1 2 3\n\n22 23\nIn some diagrams, the thread is tied to every peg.\
    \ In some, it is \nnot. Is it related to the two numbers (the number of pegs and\
    \ the \nthread-gap) being co-prime?\nMath \nTalk\nMath \nTalk\n\nPrime Time \n\
    \nMake such pictures for the following:\na.  15 pegs, thread-gap of 10 \t\n\t\n\
    b.  10 pegs, thread-gap of 7\nc.  14 pegs, thread-gap of 6 \t\n\t\nd.  8 pegs,\
    \ thread-gap of 3\n\n5.4 Prime Factorisation\nChecking if two numbers are co-prime\n\
    Teacher:\t\n\aAre 56 and 63 co-prime?\nAnshu and Guna:\t \aIf they have a common\
    \ factor other than 1, then \nthey are not co-prime. Let us check.\nAnshu:\t\n\
    \aI can write 56 = 14 × 4 and 63 = 21 × 3. So, 14 and 4 \nare factors, of 56.\
    \ Further, 21 and 3 are factors of \n63. So, there are no common factors. The\
    \ numbers \nare co-prime.\nGuna:\t\n\aHold on. I can also write 56 = 7 × 8 and\
    \ 63 = 9 × 7. \nWe see that 7 is a factor of both numbers, so, they \nare not\
    \ co-prime.\nClearly Guna is right, as 7 is a common factor. \n But where did\
    \ Anshu go wrong? \nWriting 56 = 14 × 4 tells us that 14 and 4 are both factors\
    \ of 56, but it \ndoes not tell all the factors of 56. The same holds for the\
    \ factors of 63.\nTry another example: 80 and 63. There are many ways to factorise\
    \ \nboth numbers.\n80 = 40 × 2 = 20 × 4 = 10 × 8 = 16 × 5 = ???\n63 = 9 × 7 =\
    \ 3 × 21 = ???\nWe have written ‘???’ to say that there may be more ways to \n\
    factorise these numbers. But if we take any of the given factorisations, \nfor\
    \ example, 80 = 16 × 5 and 63 = 9 × 7, then there are no common \nfactors. Can\
    \ we conclude that 80 and 63 are co-prime? As Anshu’s \nmistake above shows, we\
    \ cannot conclude that as there may be other \nways to factorise the numbers.\n\
    What this means is that we need a more systematic approach to \ncheck if two numbers\
    \ are co-prime.\n\nPrime factorisation\nTake a number such as 56. It is composite,\
    \ as we saw that it can be \nwritten as 56 = 4 × 14 . So, both 4 and 14 are factors\
    \ of 56. Now take one \nof these, say 14. It is also composite and can be written\
    \ as 14 = 2 × 7. \nTherefore, 56 = 4 × 2 × 7. Now, 4 is composite and can be written\
    \ as \n4 = 2 × 2. Therefore, 56 = 2 × 2 × 2 × 7. All the factors appearing here,\
    \ 2 \nand 7, are prime numbers. So, we cannot divide them further.\nIn conclusion,\
    \ we have written 56 as a product of prime numbers. \nThis is called prime factorisation\
    \ of 56. The individual factors are \ncalled prime factors. For example, the prime\
    \ factors of 56 are 2 and 7.\nEvery number greater than 1 has a prime factorisation.\
    \ The idea \nis the same: keep breaking the composite numbers into factors till\
    \ \nonly primes are left.\nThe number 1 does not have any prime factorisation.\
    \ It is not \ndivisible by any prime number.\nWhat is the prime factorisation\
    \ of a prime number like 7? It is just \n7 (we cannot break it down any further).\n\
    Let us see a few more examples.\nBy going through different ways of breaking down\
    \ the number, \nwe wrote 63 as 3 × 3 × 7 and as 3 × 7 × 3. Are they different?\
    \ Not \nreally! The same prime numbers 3 and 7 occur in both cases. Further, \n\
    3 appears two times in \nboth and 7 appears once.\nHere, you see four \ndifferent\
    \ ways to get \nprime factorisation of 36. \nObserve that in all four \ncases,\
    \ we get two 2s and \ntwo 3s.\nMultiply back to see \nthat you get 36 in all four\
    \ cases.\nFor any number, it is a remarkable fact that there is only one prime\
    \ \nfactorisation, except that the prime factors may come in different \n\n2×18\n\
    3×12\n4×9\n6×6\n2×2×9\n3×3×4\n2×2×9\n2×3×6\n2×2×3×3\n3×3×2×2\n2×2×3×3\n2×3×2×3\n\
    2×3×2×3\n2×2×3×3\n\nPrime Time \n\norders. As we explain below, the order is not\
