    \ Types of Angles and their Measures\nWe have read about different types of angles\
    \ in this chapter. We \nhave seen that a straight angle is 180° and a right angle\
    \ is 90°. How \ncan other types of angles — acute and obtuse — be described in\
    \ terms \nof their degree measures?\nAcute Angle: Angles that are smaller than\
    \ the right angle, i.e., less \nthan 90° and are greater than 0°, are called acute\
    \ angles. \n40⁰\nP\nR\nQ\n50⁰\nS\nT\nR\n75⁰\nE\nF\nQ\nExamples of acute angles\n\
    \nLines and Angles\n\nObtuse Angle: Angles that are greater than the right angle\
    \ and less \nthan the straight angle, i.e., greater than 90° and less than 180°,\
    \ are \ncalled obtuse angles.\nT\nW\nS\n130º\nS\nI\nX\n110º\nExamples of obtuse\
    \ angles\nHave we covered all the possible measures that an angle can take? \n\
    Here is another type of angle.\nReflex angle: Angles that are greater than the\
    \ straight angle and less \nthan the whole angle, i.e., greater than 180° and\
    \ less than 360°, are \ncalled reflex angles. \nS\nC\nP\nA\nB\nT\nM\nExamples\
    \ of reflex angles\n\t Figure it Out \n1.\t In each of the below grids, join A\
    \ to other grid points in the figure \nby a straight line to get:\na.\t An acute\
    \ angle\n\nb.\t An obtuse angle\nc.\t A reflex angle\n\t\nMark the intended angles\
    \ with curves to specify the angles. One \nhas been done for you. \n2.\t Use a\
    \ protractor to find the measure of each angle. Then classify \neach angle as\
    \ acute, obtuse, right, or reflex.\n\t\na.  ∠PTR\t\t\nb. ∠PTQ\t\t\nc. ∠PTW\t\n\
    d. ∠WTP\nT\nQ\nR\nP\nW\n\nLines and Angles\n\n Let’s Explore\nIn this figure,\
    \ ∠TER = 80°. What is \nthe measure of ∠BET? What is the \nmeasure of ∠SET? \n\
    \no90\no\nB\nE\nS\nT\nR\nHint: \aObserve that ∠REB is a straight angle. Hence,\
    \ the degree measure of \n∠REB = 180° of which 80° is covered by ∠TER. A similar\
    \ argument \ncan be applied to find the measure of ∠SET.\n\t Figure it Out\b\n\
    1.\t Draw angles with the following degree measures:\na. 140°   b. 82°   c. 195°\
    \   d. 70°   e. 35° \t\n2.\t Estimate the size of each angle and then measure\
    \ it with a \nprotractor:\na.\nb.\nc.\nd.\ne.\nf.\n\t\nClassify these angles as\
    \ acute, right, obtuse or reflex angles.\n3.\t Make any figure with three acute\
    \ angles, one right angle and two \nobtuse angles.\n4.\t Draw the letter ‘M’ such\
    \ that the angles on the sides are 40° each \nand the angle in the middle is 60°.\
    \ \n5.\t Draw the letter ‘Y’ such that the three angles formed are 150°, 60° \n\
    and 150°.\n\n6.\t The Ashoka Chakra has 24 spokes. What is the \ndegree measure\
    \ of the angle between two spokes \nnext to each other? What is the largest acute\
    \ angle \nformed between two spokes?\n7.\t Puzzle: I am an acute angle. If you\
    \ double my \nmeasure, you get an acute angle. If you triple my measure, you \n\
    will get an acute angle again. If you quadruple (four times) my \nmeasure, you\
    \ will get an acute angle yet again! But if you multiply \nmy measure by 5, you\
    \ will get an obtuse angle measure. What are \nthe possibilities for my measure?\n\
    S u m m a r y\n\x1F\n\x1F\nA point determines a location. It is denoted by a capital\
    \ letter.\n\x1F\n\x1F\nA line segment corresponds to the shortest distance between\
    \ two \npoints. The line segment joining points S and T is denoted by ST.  \n\x1F\
    \n\x1F\nA line is obtained when a line segment like ST is extended on both \n\
    sides indefinitely; it is denoted by ST or sometimes by a single small \nletter\
    \ like m.\n\x1F\n\x1F\nA ray is a portion of a line starting at a point D and\
    \ going in one direction \nindefinitely. It is denoted by DP where P is another\
    \ point on the ray.\n\x1F\n\x1F\nAn angle can be visualised as two rays starting\
    \ from a common starting \npoint. Two rays OP and OM form the angle ∠POM (also\
    \ called ∠MOP); \nhere, O is called the vertex of the angle, and the rays OP and\
    \ OM are \ncalled the arms of the angle.\n\x1F\n\x1F\nThe size of an angle is\
    \ the amount of rotation or turn needed about the \nvertex to rotate one ray of\
    \ the angle onto the other ray of the angle. \n\x1F\n\x1F\nThe sizes of angles\
    \ can be measured in degrees. One full rotation or \nturn is considered as 360\
    \ degrees and denoted as 360°.\n\x1F\n\x1F\nDegree measures of angles can be measured\
    \ using a protractor.\n\x1F\n\x1F\nAngles can be straight (180°), right (90°),\
    \ acute (more than 0° and less \nthan 90°), obtuse (more than 90° and less than\
    \ 180°), and reflex (more \nthan 180° and less than 360°).\n\n[1] \n \nCHAPTER\
