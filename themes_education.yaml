- theme: "Explain these Grade 6 CBSE Maths (NCERT Ganita Prakash) concepts from Chapter\
    \ 6 \"Perimeter and Area\": Perimeter & Area.\n\nUse ONLY the mathematical facts,\
    \ definitions, and rules described in the textbook excerpt below -- do not introduce\
    \ incorrect or additional mathematical claims. Make it very easy to understand\
    \ for an 11-12 year old: explain each idea simply, step by step, and illustrate\
    \ every concept with your own original real-life example a school student would\
    \ relate to.\n\nTextbook excerpt:\n\"\"\"\n6.1 Perimeter\nDo you remember what\
    \ the perimeter of a closed plane figure is? \nLet us refresh our understanding!\
    \ \n\t\nThe perimeter of any closed plane figure is the distance covered \nalong\
    \ its boundary when you go around it once. For a polygon, i.e., \na closed plane\
    \ figure made up of line segments, the perimeter is \nsimply the sum of the lengths\
    \ of its all sides, i.e., the total distance \nalong its outer boundary.\n\t\n\
    The perimeter of a polygon = the sum of the lengths of its all sides.\n\t\nLet\
    \ us revise the formulas for the perimeter of rectangles, squares, \nand triangles.\n\
    Perimeter of a rectangle\nConsider a rectangle ABCD whose length and breadth are\
    \ 12 cm and \n8 cm, respectively. What is its perimeter? \nPerimeter of the rectangle\
    \ = \aSum of the lengths of its four sides\n\t\n\t\n\t\n\t\n\t\n\t\n\t\n= AB +\
    \ BC + CD + DA \nA\n12 cm\nB\n8 cm\nD\nC\nPERIMETER AND AREA\n\n= AB + BC + AB\
    \ + BC \n\t\n\t\n\t\n\t\n= 2 × AB + 2 × BC\n\t\n\t\n\t\n\t\n= 2 × (AB + BC) \n\
    \t\n\t\n\t\n\t\n= 2 × (12 cm + 8 cm)  \n\t\n\t\n\t\n\t\n= 2 × (20 cm) \n\t\n\t\
    \n\t\n\t\n= 40 cm.\nFrom this example, we see that —\nPerimeter of a rectangle\
    \ = length + breadth + length + breadth.\nPerimeter of a rectangle = 2 × (length\
    \ + breadth).\n\aThe perimeter of a rectangle is twice the sum of its length and\
    \ breadth.\nPerimeter of a square \nDebojeet wants to put coloured tape all around\
    \ \na square photo frame of side 1m as shown. \nWhat will be the length of the\
    \ coloured tape \nhe requires? Since Debojeet wants to put the \ncoloured tape\
    \ all around the square photo \nframe, he needs to find the perimeter of the \n\
    photo frame. \n\t\nThus, the length of the tape required = \nperimeter of the\
    \ square \n\t\n= sum of the lengths of all four sides of the square \n\t\n= 1\
    \ m + 1 m + 1 m + 1 m = 4 m.\n\t\nNow, we know that all four sides of a square\
    \ are equal in length. \nTherefore, in place of adding the lengths of each side,\
    \ we can simply \nmultiply the length of one side by 4. \n\t\n\aThus, the length\
    \ of the tape required = 4 × 1 m = 4 m. \n\t\nFrom this example, we see that\n\
    Perimeter of a square = 4 × length of a side.\n\t\nThe perimeter of a square is\
    \ quadruple the length of its side.\nOpposite sides of a \nrectangle are always\
    \ \nequal. So, AB = CD and \nAD = BC\n1 m\n\nPerimeter and Area\n\nPerimeter of\
    \ a triangle\nConsider a triangle having three given sides of  \nlengths 4 cm,\
    \ 5 cm and 7 cm. Find its perimeter. \nPerimeter of the triangle = 4 cm + 5 cm\
    \ + 7 cm\n\t\n\t\n\t\n\t\n\t\n\t\n   = 16 cm.\nPerimeter of a triangle = sum of\
    \ the lengths of its three sides.\t\nExample: Akshi wants to put lace all around\
    \ a \nrectangular tablecloth that is 3 m long and 2 m \nwide. Find the length\
    \ of the lace required.\nSolution\n\t\n\t Length of the rectangular table cover\
    \ = 3 m.\n\t\n\t Breadth of the rectangular table cover = 2 m.\n\t\n\t Akshi wants\
    \ to put lace all around the \ntablecloth. \n\t\n\t Therefore, the length of the\
    \ lace required will be the perimeter of the \nrectangular tablecloth.\n\t\n\t\
    \ Now, the perimeter of the rectangular tablecloth\t= 2 × (length + breadth) \n\
    \t\n\t\n\t\n\t\n\t\n\t\n\t\n\t\n\t\n\t\n\t\n\t\n= 2 × (3 m + 2 m) \n\t\n\t \t\n\
    \t\n\t\n\t\n\t\n\t\n\t\n\t\n\t\n\t\n\t\n= 2 × 5 m = 10 m.\n\t\n\t Hence, the length\
    \ of the lace required is 10 m.\nExample: Find the distance travelled by Usha\
    \ if she takes three rounds of \na square park of side 75 m.\nSolution\n\t\n\t\
    \ Perimeter of the square park = 4 × length \nof a side = 4 × 75 m = 300 m.\n\t\
    \n\t Distance covered by Usha in one  \nround = 300 m. \n\t\n\t Therefore, the\
    \ total distance travelled by \nUsha in three rounds = 3 × 300 m = 900 m.\n5 cm\
    \ \n4 cm \n7 cm \n\n Figure it Out\n1.\t Find the missing terms: \na.\t\nPerimeter\
    \ of a rectangle = 14 cm; breadth = 2 cm; length = ?.  \nb.\t\nPerimeter of a\
    \ square = 20 cm; side of a length = ?. \nc.\t\nPerimeter of a rectangle = 12\
    \ m; length = 3 m; breadth = ?. \n2.\t \aA rectangle having sidelengths 5 cm and\
    \ 3 cm is made using a \npiece of wire. If the wire is straightened and then bent\
    \ to form a \nsquare, what will be the length of a side of the square? \n3.\t\
    \ \aFind the length of the third side of a triangle having a perimeter \nof 55\
    \ cm and having two sides of length 20 cm and 14 cm, \nrespectively. \n4.\t \a\
    What would be the cost of fencing a rectangular park whose length \nis 150 m and\
    \ breadth is 120 m, if the fence costs `40 per metre?\n5.\t \aA piece of string\
    \ is 36 cm long. What will be the length of each \nside, if it is used to form:\
    \ \na.\t\nA square, \nb.\t\nA triangle with all sides of equal length, and \n\
    c.\t\nA hexagon (a six sided closed figure) with sides of equal \nlength?\n6.\t\
    \ \aA farmer has a rectangular field having length 230 m and breadth \n160 m.\
    \ He wants to fence it with 3 rounds of rope as shown. What \nis the total length\
    \ of rope needed?\n\nPerimeter and Area\n\nStarting Point \nfor Toshi\nAkshi and\
    \ Toshi start running along the rectangular \ntracks as shown in the figure. Akshi\
    \ runs along the \nouter track and completes 5 rounds. Toshi runs along \nthe\
    \ inner track and completes 7 rounds. Now, they \nare wondering who ran more.\
    \ Find out who ran the \nlonger distance.\nStarting Point\nfor Akshi\n60 m\n70\
    \ m\n30 m\n40 m\n\t\nEach track is a rectangle. Akshi’s track has length 70 m\
    \ and breadth \n40 m. Running one complete round on this track would cover 220\
    \ m, \ni.e., 2 × (70 + 40) m = 220 m. This is the distance covered by Akshi in\
    \ \none round.\n Figure it Out\n1.\t \aFind out the total distance Akshi has covered\
    \ in 5 rounds.\n2.\t Find out the total distance Toshi has covered in 7 rounds.\
    \ Who ran \na longer distance?\n3.\t Think and mark the positions as directed—\n\
    a.\t\n\tMark ‘A’ at the point where Akshi will be after she ran 250 m.\nb.\t\n\
    \aMark ‘B’ at the point where Akshi will be after she ran 500 m.\nc.\t\n\aNow,\
    \ Akshi ran 1000 m. How many full rounds has she finished \nrunning around her\
    \ track? Mark her position as ‘C’.\nd.\t\n\aMark ‘X’ at the point where Toshi\
    \ will be after she ran 250 m.\ne.\t\n\aMark ‘Y’ at the point where Toshi will\
    \ be after she ran 500 m.\nMatha Pachchi!\n\nf.\t\n\aNow, Toshi ran 1000 m. How\
    \ many full rounds has she finished \nrunning around her track? Mark her position\
    \ as ‘Z’.\n\a\n Deep Dive: In races, usually there is a common finish line for\
    \ all \nthe runners. Here are two square running tracks with the inner track \n\
    of 100 m each side and outer track of 150 m each side. The common \nfinishing\
    \ line for both runners is shown by \nthe flags in the figure which are in the\
    \ center \nof one of the sides of the tracks.\n\a\t\nIf the total race is of 350\
    \ m, then we have \nto find out where the starting positions of the \ntwo runners\
    \ should be on these two tracks so \nthat they both have a common finishing line\
    \ \nafter they run for 350 m. Mark the starting \npoints of the runner on the\
    \ inner track as ‘A’ \nand the runner on the outer track as ‘B’.\n Estimate and\
    \ Verify\nTake a rough sheet of paper or a sheet of newspaper. \nMake a few random\
    \ shapes by cutting the paper \nin different ways. Estimate the total length of\
    \ the \nboundaries of each shape then use a scale or measuring \ntape to measure\
    \ and verify the perimeter for each \nshape.\n Akshi says that the perimeter of\
    \ this triangle shape is 9 units. \nToshi says it can’t be 9 units and the perimeter\
    \ will be more than 9 \nunits. What do you think?\nThe perimeter is \n9 units.\n\
    No, it will be more \nthan 9 units.\n150 m\nCommon Finishing Line\n100 m\n\nPerimeter\
    \ and Area\n\nThis figure has lines of two different unit lengths. Measure the\
    \ \nlengths of a red line and a blue line; are they same? We will call the \n\
    red lines — straight lines and the blue lines — diagonal lines. So, the \nperimeter\
    \ of this triangle is 6 straight units + 3 diagonal units. We \ncan write this\
    \ in a short form as: 6s + 3d units.\n Write the perimeters of the figures below\
    \ in terms of straight and \ndiagonal units.\nPerimeter of a regular polygon\n\
    Like squares, closed figures that have all sides and all angles equal \nare called\
    \ regular polygons. We studied the sequence of regular \npolygons as ‘Shape Sequence’\
    \ #1 in Chapter 1. Examples of regular \npolygons are the equilateral triangle\
    \ (where all three sides and all \nthree angles are equal), regular pentagon (where\
    \ all five sides and \nall five angles are equal), etc.\nPerimeter of an equilateral\
    \ triangle\nWe know that for any triangle its perimeter \nis sum\n\"\"\""
