themes:
- theme: '0-27 seconds - Hook

    Chapter 1 "Patterns in Mathematics": What is Mathematics? & Patterns in Numbers.
    Write an exciting, curiosity-sparking opening for 11-12 year old students -- no
    facts/figures needed here.


    27-163 seconds - What is Mathematics?

    Section 1.1 "What is Mathematics?" -- explain this step by step, simply enough
    for an 11-12 year old, and illustrate it with your own original real-life example
    a school student would relate to. Textbook facts:

    Mathematics is, in large part, the search for patterns, and for the explanations
    as to why those patterns exist. Such patterns indeed exist all around us — in
    nature, in our homes and schools, and in the motion of the sun, moon, and stars.
    They occur in everything that we do and see, from shopping and cooking, to throwing
    a ball and playing games, to understanding weather patterns and using technology.
    The search for patterns and their explanations can be a fun and creative endeavour.
    It is for this reason that mathematicians think of mathematics both as an art
    and as a science. This year, we hope that you will get a chance to see the creativity
    and artistry involved in discovering and understanding mathematical patterns.
    It is important to keep in mind that mathematics aims to not just find out what
    patterns exist, but also the explanations for why they exist. Such explanations
    can often then be used in applications well beyond the context in which they were
    discovered, which can then help to propel humanity forward.


    For example, the understanding of patterns in the motion of stars, planets, and
    their satellites led humankind to develop the theory of gravitation, allowing
    us to launch our own satellites and send rockets to the Moon and to Mars; similarly,
    understanding patterns in genomes has helped in diagnosing and curing diseases
    — among thousands of other such examples.


    163-248 seconds - Patterns in Numbers

    Section 1.2 "Patterns in Numbers" -- explain this step by step, simply enough
    for an 11-12 year old, and illustrate it with your own original real-life example
    a school student would relate to. Textbook facts:

    Among the most basic patterns that occur in mathematics are patterns of numbers,
    particularly patterns of whole numbers: 0, 1, 2, 3, 4, ... The branch of Mathematics
    that studies patterns in whole numbers is called number theory. Number sequences
    are the most basic and among the most fascinating types of patterns that mathematicians
    study. Table 1 shows some key number sequences that are studied in Mathematics.


    Table 1: Examples of number sequences

    1, 1, 1, 1, 1, 1, 1, ... (All 1''s)

    1, 2, 3, 4, 5, 6, 7, ... (Counting numbers)

    1, 3, 5, 7, 9, 11, 13, ... (Odd numbers)

    2, 4, 6, 8, 10, 12, 14, ... (Even numbers)

    1, 3, 6, 10, 15, 21, 28, ... (Triangular numbers)

    1, 4, 9, 16, 25, 36, 49, ... (Squares)

    1, 8, 27, 64, 125, 216, ... (Cubes)

    1, 2, 3, 5, 8, 13, 21, ... (Virahanka numbers)

    1, 2, 4, 8, 16, 32, 64, ... (Powers of 2)

    1, 3, 9, 27, 81, 243, 729, ... (Powers of 3)


    248-270 seconds - Recap

    Briefly restate the key ideas from What is Mathematics? & Patterns in Numbers
    so students remember them.'
