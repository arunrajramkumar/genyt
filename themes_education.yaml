    \ as shown below \nby tracing and cutting out the shape of one of the rotating\
    \ arms.\nNow, shuffle and mix up all the rotating arms. Can you identify \nwhich\
    \ of the rotating arms will pass through the slit? \nThe correct one can be found\
    \ by placing each of the rotating arms \nover the slit. Let us do this for some\
    \ of the rotating arms:\nSlit angle is greater than \nthe arms’ angle. The arms\
    \ \nwill not go through the \nslit. \nSlit angle is less than the \narms’ angle.\
    \ The arms \nwill not go through the \nslit.\nSlit angle is equal to the \narms’\
    \ angle. The arms will \ngo through the slit. \nOnly the pair of rotating arms\
    \ where the angle is equal to that of the \nslit passes through the slit. Note\
    \ that the possibility of passing through \nthe slit depends only on the angle\
    \ between the rotating arms and not \non their lengths (as long as they are shorter\
    \ than the length of the slit).\n\nLines and Angles\n\nChallenge: Reduce \nthis\
    \ angle. \nAngle \nreduced.\nThe angle is still \nthe same!\n\n2.8 Special Types\
