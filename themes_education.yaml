    \ verify your answer.\na.\nb.\nd.\nc.\n\n Suppose you have to get each of these\
    \ shapes with some folds and \na single straight cut. How will you do it?\n\t\n\
    a. The hole in the centre is a square.\n\t\nb. The hole in the centre is a square.\n\
