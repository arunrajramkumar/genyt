    \ Why? \nShabnam: \x03To compare the first two groups, \nwe have to find fractions\
    \ \nequivalent to the fractions  \n\n4  and 7\n10.\nMukta: How about  6\n8  =\
    \ 3\n4  and 21\n30 = 7\n10?\nMath \nTalk\n \aIf the number of units that are shared\
    \ \nis the same, but the number of \nchildren among whom the units are \nshared\
